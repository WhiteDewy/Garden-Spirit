    '9':
      title: 聪明和智慧
      jin: 对哲学、宗教、异域文化有好奇心，知识积累丰富、有文化；手足定居远方、海外，带来见闻与机会
      ke: 学业不顺，三观不正，立场多变；手足与自己三观不合，文化程度一般，在外发展不顺
    '10':
      title: 3之8，一颗七窍玲珑心
      jin: 为人八面玲珑，口才、写作、交通物流相关有助事业发展，适合经营媒体、物流、交通行业；手足有成就，能助力自己事业
      ke: 易遭流言蜚语，因口舌是非带来事业名誉受损；手足状态或发展不如意
    '11':
      title: 忠于理想、渴望同频沟通
      jin: 在意精神交流，因抒发意见得到欢迎和认同，适合搞自媒体，喜欢和朋友聊天，出行访友有收获；手足人缘好，与手足有思想共鸣
      ke: 容易被人误解，遭到朋友非议，容易网上被黑；手足人缘不好，易交损友
    '12':
      title: 高灵高敏
      jin: 学习身心灵及医学有天赋，爱幻想，灵感丰富；手足亲友与身心灵或医疗行业相关，因此得到帮助
      ke: 暗中受到非议，精神压力较重；手足亲缘浅薄，对自己不利
