house_flights:
  4:
    '1':
      title: 身负家族使命
      jin: 家庭责任感强，容易获得家庭的支持；心思细腻、记忆力好，与历史、土地、建筑、房产结缘深；得到父亲帮助多
      ke: 没有安全感、情绪多变，因房产和家庭遇到麻烦；被家庭或父亲所拖累
    '2':
      title: 重视地产价值，土地是财，有囤积癖
      jin: 因土地资源、房产和囤积获利；因家庭和父亲得财
      ke: 为土地行业、房产受损或囤积的物品受损；为家庭和父亲破财
    '3':
      title: 身如浮萍，游居天下
      jin: 喜欢旅居的生活方式，常静极思动，与发小、手足同住比较舒服；因为手足亲友获得住宅方便和利益
      ke: 旅居条件差，和手足同住不快，和手足争家产；父亲容易为手足亲友所累，房产蒙受损失
    '4':
      title: 家是港湾，是默默的托举（入庙）
      jin: 性格坚韧，有同理心，通常家境、出生不错，在本地发展利好，继承祖产；父亲能力强发展好
      ke: 家庭烦恼多，容易家道中落，内心比较敏感脆弱，不动产或土地资源容易遇到波折；父亲不如意，性格不佳，容易给自己造成心理阴影
    '5':
      title: 亲子关系与父性图腾
      jin: 内心阳光开朗，对恋人和子女包容，爱收藏；家庭关系愉快，父母对恋人和子女友善，父亲幽默
      ke: 容易对恋人和子女展现负面情绪和悲观态度；祖产易因子女、赌博投机等遭受损失；父亲好赌，风流债多
    '6':
      title: 谦卑是一种美德
      jin: 善于提供照顾与帮助，细心，与同事一起住比较省心；你（或父亲家族）容易从事健康照护、宠物、服务行业，并容易获得成就；父亲可能从事相关行业工作，或具备高超的专业技能
      ke: 因居住环境不佳而影响健康，心力疲惫；父亲社会地位不高，工作不如意，身心状态需要被照顾
    '7':
      title: 和睦的家庭关系
      jin: 伴侣善于经营家庭关系，打理家庭资产，获得家族资源，在家中有话语权；伴侣与父亲关系较好
      ke: 婚姻关系不和谐，没有滋养感，易发生不动产法律纠纷；与父亲关系不好，父亲会影响自己的婚姻关系
    '8':
      title: 家族兴旺，代际相承
      jin: 获得祖产，继承家业，有利于从事地产、农业、收藏相关生意；父亲很有经商头脑，投机运好
      ke: 因投资、购买房产而负债亏损；父亲相关事务压力较重，健康议题需要现实层面的关照
    '9':
      title: 人挪活，树挪不一定枯
      jin: 容易移居他乡、远方，且迁徙后居所环境得到提升；父亲远行在外运势不错；容易在历史研究和学习方面取得好成绩
      ke: 乔迁远方后，居住环境不舒适；父亲在外远行运势不佳
    '10':
      title: 成家立业，家和万事兴
      jin: 事业发展获得家庭支持（得到父亲支持），有利于涉及土地、农业、建筑、矿产行业；父亲社会地位高，和母亲关系好
      ke: 事业发展受到家庭问题拖累，被迫常驻公司单位，因事业发展不顺变卖家产；父亲事业发展不顺，父母关系不融洽
    '11':
      title: 4之8，既是登神梯，亦是心魔关
      jin: 理想与抱负得到理解，与父亲相处如朋友一般；与人合租提供住宿便利与帮助；父亲社交运好，有贵人运
      ke: 实现理想与抱负困难重重，内心的执念无法被人理解和支持，与人合租不舒适；父亲社交选择容易带来消耗，人际与健康议题需要更多现实支持
    '12':
      title: 闭关以求心灵平静，内心世界丰盛
      jin: 良好的身心灵感知力（甚至能链接高维、灵性），可能出生于相关世家，比较宅，不自觉闭关；父亲有身心灵或医学技能，心肠慈悲
      ke: 远离出生之地，住宿清苦，多有被尘封的童年阴影，不可随意通灵，内心总上演悲剧；容易被父亲忽视、遗弃、伤害，父亲身体可能不佳
  5:
    '1':
