    '6':
      title: 换位思考，ta也需要你的关怀与照顾
      jin: ta是一位重视工作、忙碌不停的人；懂得关照别人，细心有服务精神
      ke: ta的条件不如你，容易焦虑紧张；你可能会漠视ta的付出；ta的工作不太顺利，身体健康需要被重视
    '7':
      title: 关系质量需要看见
      jin: 姻缘佳；ta的综合素质（能力、天赋）优异，个人能力出色，通常是个自信又值得托付的人；重视信诺
      ke: 婚姻互动里容易累积不满，ta的状态与习惯需要更细致理解；也要留意关系边界与外界干扰
    '8':
      title: ta的心机城府，是令你着迷的原因
      jin: ta通常是颇有些心思、让你猜不透的人；伴侣富有，很有赚钱的头脑；合伙利财，合伙做生意容易挣到钱
      ke: ta容易遭受金钱和物质上的巨大损失；对你隐瞒了很多秘密、或有极强的掌控欲；注意ta遇到突发风险；合伙要挑选时机
    '9':
      title: 富有挑战性的婚姻
      jin: ta是外地人（可能是老外），也或者是高知、有文化的另一半；婚后去外地发展更好
      ke: 三观上的冲突，文化差异给婚姻带来矛盾；容易分居、异地；不利于远行，容易有争端；遭遇官司纠纷
    '10':
      title: 幸福的婚姻需要经营
      jin: ta的家境不错或社会地位高，通常能做出一番事业；你们可以成为很好的事业搭子；你在事业发展中非常善于合作
      ke: 婚姻与事业发展存在冲突；ta与家人不和睦，ta的事业发展不顺利；你容易反感上位者；你的事业发展容易碰到竞争对手
    '11':
      title: 是否善于经营人脉关系
      jin: ta善于与人打交道，人缘特好；婚姻会拓展你的人脉圈子；你与ta在精神维度上有默契；愿意和朋友合作，收获不错
      ke: ta有烂桃花纠缠，之前可能有过孩子；你的人际关系不佳，不喜欢交朋友；你与ta难以获得精神共鸣
    '12':
      title: 关系中的隐秘牵引
      jin: ta有玄学、艺术、宗教方面的天赋，或有从事公益、医疗、大众服务行业；ta喜欢独处，沉浸在自己的精神世界，容易疲惫、低精力；婚姻能够激发你的潜能
      ke: 容易陷入暧昧或隐秘关系，关系能否稳定需要更多现实承诺；ta的情绪或精神压力需要被理解，低潮时也要留意边界；婚姻中可能夹杂回避、债务或隐秘压力
  8:
    '1':
      title: 直面恐惧与贪婪
      jin: 危机意识强、城府深、自控能力出色；直觉敏锐、善于把握时机；容易获得他人馈赠（合伙财）、有遗产运；善做生意、投资
      ke: 容易遇到突发风险，安全感与生命力议题需要被认真照顾；疑心重、控制欲过强、亲密边界失衡；容易有债务问题
    '2':
      title: 风险收入与资源边界
      jin: 容易获得他人信任，得到资金或投资；有利于从商，以钱生钱；强烈的独占欲
      ke: 容易对他人钱财、资源产生强烈执着；为了搞钱、搞资源可能忽略边界；容易因钱引发压力或麻烦，债务风险需要提前管理
    '3':
      title: 8之8，能言善辩，言辞犀利
      jin: 辩论高手，总能说服他人；对语言沟通的技巧有深入研究，善于分析；掌握人性弱点；讲义气
      ke: 嘴毒、言语刻薄、喜欢嘲讽他人；思想阴暗、不容易和身边人建立信任；手足亲友也可能面临突发压力；交通出行更要谨慎
    '4':
      title: 内驱力强悍的心理博弈大师
      jin: 心理素质极为过硬，对内在自我有深刻的探究；有研究历史、心理学、室内软装设计方面的天赋；容易从投资土地、房产、收藏领域获得利益；得到遗产
      ke: 尖锐的情绪问题，深藏不漏的野心与控制欲；原生家庭比较窒息，喜居幽暗环境；房产田产纠纷损失；父亲、长辈相关财务或健康议题需要更早规划
    '5':
      title: 善于钻研，投其所好
      jin: 善赚偏财、投机运好、边玩边赚钱；有异常出色的审美创作与娱乐天赋；与人相处非常懂得投其所好；有独到的吸引桃花技巧；子女运佳
      ke: 沉迷博彩或享乐、亲密边界失衡；子女/亲子议题容易带来强烈担忧与波折；容易因孩子、恋情、贪图享乐而破财
    '6':
      title: 职业选择，剑走偏锋
      jin: 有研究精神、学无止境、通常有极强的专业技能；有利从事投融资、保险、医疗、服务行业；有养生、照顾动物的特长
      ke: 身心负荷较重，容易遇到突发健康压力；被同事、下属、瞧不起的人坑害
    '7':
      title: 高嫁高娶，还是看似风光而已
      jin: 伴侣财运好、婚后财运佳，合作生财；对伴侣的占有欲强烈、性事愉悦；洞察人际关系的核心本质，对抗路夫妻
      ke: 伴侣身心状态或共同资源压力较重；容易与人产生剧烈冲突；长久僵持拉扯的情感关系；被骗财骗色
    '8':
      title: 黑色吸引力
      jin: 身心状态稳定，风险意识较强；偏财运佳；心志坚定、抗压能力出色、克制力与决断力突出；有种莫名的吸引力
      ke: 人生压力经历较多；深层心理议题需要被认真照顾；容易接触复杂的人性与资源面向
    '9':
      title: 睿智学者
      jin: 异地得财，有利于从事教育、出版、海外贸易、法律、留学相关行业；容易成为学者或文化圈人才
      ke: 考运不佳、学业不利；出行在外容易遇到突发波折；司法纠纷破财；伴侣因手足亲友破财；异地安全与法律边界要更谨慎
    '10':
      title: 低调精明、黑马人设
      jin: 事业项目扩展资源充足，多有人乐意投资；专项细分赛道能获取佳绩；独断型领导、有利创业
      ke: 容易被上位者拖累，容易遇到操控型领导；事业发展可能遭受重大打击；可能在权力/资源关系中感到被物化；创业破财、负债；身后评价也容易有争议
    '11':
      title: 雨露均沾，经营人脉关系
      jin: 善于经营人脉关系、挖掘机会；好人缘带来财机、善于学习别人的生意经；圈层级别高
      ke: 被朋友坑害、遭受连带损失；坑害公司或团队利益；容易接触反社会、反团结思想、或参与极端组织
    '12':
      title: 隐秘资源与非典型收入
      jin: 有非典型、项目制或较隐秘的收入机会；从事身心灵、疗愈、公益服务行业得财；事以密成，要做的事情别让人知道；总有不愿与人分享的心事
      ke: 莫名破财、因小人坑害破财；心理与精神压力需要被照顾；亲水/封闭空间相关安全意识要更谨慎
  9:
    '1':
      title: 驿马入命，人生浮萍
      jin: 命运轨迹、人生版图宽广；迁徙多；心性豁达、豪爽、仁慈、富有正义感；远行、哲学
      ke: 远离家乡易遇波折；考运不佳；信仰迷失
    '2':
      title: 游牧民族，狩猎者习性
      jin: 见多识广、眼界和经历、智慧带来财富；传媒、国际贸易、文化教育、宗教行业得财；具备启发他人财商的天赋；具备搭建资源财富管道的能力
      ke: 旅行、文凭学历、司法纠纷破财；因配偶亲友破财
    '3':
      title: 归纳总结思考能力卓越、语言天赋佳
      jin: 好学、善学，学习、考试犹如开挂；差旅好处多；喜欢与人辩论哲学问题；善于鼓励他人；手足亲友多高学历
      ke: 思考问题太局限、不善于拓展思考；也许聪明、但不智慧；奔波多、出行不顺
    '4':
      title: 9之8，精神上的异乡人
      jin: 喜爱体验不同的文化风俗，热衷于在住宿环境中加入跨文化或宗教元素；父亲很智慧、人生经历丰富
      ke: 父亲身心状态需要被照顾；晚年不宜去外地，生活不顺；居家装修环境过于浮夸；房产容易涉及司法问题
    '5':
      title: 流浪癖、漫游症
      jin: 旅行令人愉快、放松心情；桃花为爱奔赴千里而来、有文化且浪漫；有跨文化、宗教领域的创作天赋；演讲时极富魅力、具有舞台表演天赋；孩子学历好
      ke: 痴迷流浪生活；示爱笨拙浮夸、远方烂桃花多；爱出洋相；子女在外发展不顺、考运不佳
    '6':
      title: 文化人干文化事
      jin: 通常具备不错的理论技能和沟通技巧；学术、教育、留学、海外相关工作机会多；同事多高学历、有文化；因交流学术出行；考证厉害
      ke: 出行在外容易身心不适；外地问诊就医；考证吃力；同事、下属伦理道德素质低
    '7':
      title: 异地情缘
      jin: 伴侣学历高、有文化、在外地结婚；伴侣口才好、容易获得伴侣的思想启迪；一起旅行运势佳
      ke: 伴侣表达灵活但也可能让人难以捉摸，三观与异地安排需要磨合；若关系进入法律或协议层面，沟通成本会明显上升
    '8':
      title: 思想深邃、有见地
      jin: 有高深的学术造诣、博弈论、心理学大成；师长可能是行业专家；能充分的将学术能力变现；有利外地进修、旅行、差旅发现商机
      ke: 旅行受伤；因遗产导致法律纠纷；学业偏科；思想极端
    '9':
      title: 智慧导师
      jin: 品性端正、道德感极强、学富五车；学术、信念有影响力、扩散力强，拥有启迪他人智慧的天赋与使命感；适合从事教育、传媒、宗教、航空行业
      ke: 思想偏颇；品性、观念容易遭到攻击或动摇；在学业进修和探索人生意义的过程中遭遇诸多麻烦
    '10':
      title: 造梦者还是传销大师
      jin: 对信念与愿景的追求支持着你的事业；学术水平、价值观、倡议和冒险精神为事业添砖加瓦；追随者和信奉者众多；良好的企业文化氛围
      ke: 因学业、司法纠纷、涉外事宜影响事业发展；愿景太过缥缈难以实现；被怀疑是传销头子；学术造假影响声誉
    '11':
      title: 道不同不相为谋
      jin: 因高等教育、留学、学术交流收获志同道合的朋友；出门在外容易结识朋友、结识外地和异国友人、得到帮助和支持多；容易加入高知圈子
      ke: 与朋友在理念上有冲突；朋友反目容易打舆论战、道德谴责；因朋友而遭受司法纠纷或名誉受损
    '12':
      title: 灵性导师
      jin: 学习身心灵、玄学、宗教有天赋；适合从事身心灵教育、传播相关工作
      ke: 考运不佳、阴差阳错；无信仰；司法纠纷导致法律风险；远行安全议题
  10:
    '1':
      title: 百炼成钢，屡败屡战
      jin: 明确的目标感、组织计划与管理天赋；受青睐，容易获得领导青睐并获得提拔机会；受尊敬、有利于创业、仕途运好、职业生涯获得成就
      ke: 权力心重、百折不挠、为事业劳心费力；被轻视、事业发展受挫伤及信心、名誉受损；不受上级领导器重，或容易被上级领导连累
    '2':
      title: 稳扎稳打、经营得财
      jin: 良好的事业发展与名声地位获得财富机会；有利从事银行、餐饮行业；理财和储蓄能力较为出色
      ke: 因事业发展破财；因领导上司、母亲破财；经营项目遇到现金流问题
    '3':
      title: 善谈生意经
      jin: 乐于与人交流职业经历、借此收获发展机会；手足亲友有不俗的事业成就、彼此提携；有利于从事文书、写作、媒体、销售、物流、交通行业
      ke: 工作缺乏计划性与坚定决心；与领导沟通不畅、差旅不顺；兄弟姐妹缘分浅，母亲/手足相关孕育议题有波折
    '4':
      title: 家庭地位
      jin: 因事业发展顺利提高自身家庭地位高；家庭因自己的发展顺利收获名声；适合从事土地、房产、建筑、装修、矿产等行业；父亲事业得吉
      ke: 因事业发展导致家庭问题；父亲事业不利；父母关系不和睦
    '5':
      title: 10之8，事业与爱情能否兼得
      jin: 因事业成就与身份地位提升个人魅力、吸引桃花；容易遇到事业型恋人；被领导喜欢、带着一起玩、收到礼物；借自身事业资源给恋人、子女带来帮助；适合从事娱乐、亲子、艺术创作行业
      ke: 因事业不顺或个人声誉受损而拖累恋人、子女；因纵情享乐而不务正业；因领导上级破财
    '6':
      title: 领导力、凝聚力
      jin: 领导上级传授工作经验；职场名声不错；同事下属未来事业发展好、带来事业方面的互相帮助；适合从事服务行业、宠物、医疗行业
      ke: 事业忙碌、身份地位不高；职场发展不顺；上下级关系不融洽、晋升不容易
    '7':
      title: 竞争与合作
      jin: 善于化敌为友、获得对手尊重；与领导关系密切、备受重用；创业合作顺利；伴侣事业不俗、带来工作上的帮助
      ke: 在事业竞争中遭遇失败；合伙不利；事业发展带来婚姻问题
    '8':
      title: 祸福相依、大起大落
      jin: 因他人资源转移、遗产/保险/共同资产议题获利；容易获得母亲、上级领导的馈赠；有利从事金融、保险、投资、税务行业；生意财旺、能争取到投资
      ke: 母亲的身心状态需要现实关照；容易因事业发展失败而负债；领导心思多、容易被拖累
    '9':
      title: 画饼是种能力
      jin: 因事业发展提升见闻与差旅经历、学历深造的契机；从工作事业中培养演讲与煽动情绪的能力；拓展事业版图有利，甚至往国外发展；从事教育、留学、跨国贸易等行业有利
      ke: 因事业发展感受到学历和知识储备吃紧；可能因工作颠覆三观；不利差旅、不利拓展海外市场
    '10':
      title: 好名声带来好机遇（入庙入旺）
      jin: 容易成为公众人物；个人名声、地位与事业发展相辅相成；高超的管理水平；前程似锦、贵人相助，有利于从政
      ke: 事业发展不顺；容易与人争虚名；不被领导重视；外界评价不好
    '11':
      title: 不止是为自己奋斗
      jin: 通过事业拓展人际关系、美名远扬、喜逢贵人；有利从事互联网行业、加入大平台、大企业；通过事业追求愿景的实现
      ke: 事业发展容易破坏人际关系或者遭人非议；项目遭遇资金困难；理想破碎
    '12':
      title: 大众服务、公益事业
      jin: 创造福祉、为社会做出贡献、易有美名；有利从事公众、公益事业；有利从事身心灵、艺术、医疗行业；适合幕后、不露脸的工作
      ke: 事业容易失败、承受污名；是非小人多；因损害集体利益遭受法律与声誉风险
  11:
    '1':
      title: 善结人缘
      jin: 善于多元视角、见解独到、有创意；乐于体验不同的人生经验；人缘好、贵人多、朋友乐于相助；善于组织活动、精神追求高；自带人气、流量、粉丝多
      ke: 孤僻厌世甚至反社会；人缘差、不喜交际、社交评价差、人际关系麻烦多；为朋友所拖累
    '2':
      title: 吃喝玩乐朋友多
      jin: 财源广进、总有朋友带来赚钱机会；能从互联网、社交圈中收获挣钱机会；加入商业组织；常有人请客吃饭
      ke: 因朋友破财、借钱拿不回；轻信不实信息而破财
    '3':
      title: 得道多助失道寡助（三分位得吉）
