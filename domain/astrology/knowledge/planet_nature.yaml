# 星性规则（Planet Nature）
#
# 每颗星的完整属性 + 在不同话题语境下的角色 + 特殊规则。
# 用于：
#   1. 从话题 → 自动确定核心星（primary planets）和辅助星（supporting planets）
#   2. 从星性 → 生成话题相关的角色描述
#   3. 特殊规则（如"被木星互溶 = 多线发展"）沉淀为可复用逻辑
#
# 与 planets.yaml 的关系：
#   planets.yaml = 行星天文/尊贵基础数据
#   planet_nature.yaml = 行星在解读中的"人格"与话题角色
#   二者互补，不重复。

planets:
  sun:
    label: "太阳"
    label_en: "Sun"
    nature: [self_will, vitality, authority, honor, creativity, being_seen]
    nature_zh: ["自我意志", "生命力", "权威", "荣耀", "创造力", "被看见"]
    core_verb: "表达自我、要在这个领域被看见"
    core_formula: "自我意志 × {house_domain} × {dignity_adverb}"
    # 在不同话题领域的角色权重
    domain_signals:
      career: core          # 事业：核心 —— 社会身份/被看见
      relationship: supporting  # 感情：辅助 —— 在关系中你的自我如何表达
      wealth: supporting    # 财富：辅助 —— 自我价值感影响赚钱方式
      health: core          # 健康：核心 —— 生命力直接关联身体
      emotion: neutral
      family: supporting    # 家庭：辅助 —— 父亲/权威
      learning: neutral
      growth: neutral
      network: neutral
      self: core            # 自我：核心 —— 意志/我是谁/生命力
    # 关系语境中的角色
    relation_role: "自我核心——你的'我要'在关系里怎么放"
    # 男女盘差异
    gender_diff: null  # 太阳不分男女盘差异

  moon:
    label: "月亮"
    label_en: "Moon"
    nature: [emotion, dependency, security, nurture, instinct, memory, belonging]
    nature_zh: ["情绪", "依赖", "安全感", "滋养", "习惯", "本能", "归属"]
    core_verb: "寻求情绪满足与归属感"
    core_formula: "依赖感 × {house_domain} × {dignity_adverb}"
    domain_signals:
      career: supporting   # 事业：辅助 —— 情绪状态影响工作表现
      relationship: core   # 感情：核心 —— 长久靠月亮，不是金星
      wealth: supporting   # 财富：辅助 —— 情绪安全感驱动消费/储蓄
      health: core         # 健康：核心 —— 身心连接
      emotion: core        # 情绪：核心 —— 情绪本能/安全感
      family: core         # 家庭：核心 —— 母亲/家庭根基
      learning: supporting # 学习：辅助 —— 学习环境需要情绪安全感
      growth: neutral
      network: neutral
      self: core           # 自我：核心 —— 潜意识/本能/归属
    relation_role: "依赖感核心——你想黏着谁，谁让你觉得安心。长久靠月亮，不靠金星。"
    gender_diff: null  # 月亮不分男女盘

  mercury:
    label: "水星"
    label_en: "Mercury"
    nature: [mind, communication, learning, commerce, information, flexibility]
    nature_zh: ["思维", "沟通", "学习", "交易", "信息", "灵活"]
    core_verb: "思维运转与信息交换"
    core_formula: "思维 × {house_domain} × {dignity_adverb}"
    domain_signals:
      career: supporting   # 事业：辅助 —— 沟通/技能/信息处理
      relationship: supporting  # 感情：辅助 —— 怎么跟伴侣沟通
      wealth: supporting   # 财富：辅助 —— 信息差/口才变现
      health: neutral
      emotion: neutral
      family: neutral
      learning: core       # 学习：核心 —— 学习的核心工具
      growth: neutral
      network: core        # 人际：核心 —— 沟通/信息交换/联结
      self: neutral
    relation_role: "沟通频道——你怎么跟对方说、怎么说自己、怎么理解对方说的。"
    gender_diff: null

  venus:
    label: "金星"
    label_en: "Venus"
    nature: [attraction, charm, aesthetics, value, pleasure, harmony, relating]
    nature_zh: ["吸引力", "魅力", "审美", "价值感", "愉悦", "和谐", "关系"]
    core_verb: "释放魅力与吸引力"
    core_formula: "魅力 × {house_domain} × {dignity_adverb}"
    domain_signals:
      career: supporting   # 事业：辅助 —— 人际/审美/和谐（不是事业主线但加分）
      relationship: core   # 感情：核心 —— 魅力发射器；关系里有没有爱
      wealth: core         # 财富：核心 —— 价值观与金钱/奢侈品/审美消费
      health: neutral
      emotion: supporting  # 情绪：辅助 —— 愉悦感/被爱感
      family: neutral
      learning: supporting # 学习：辅助 —— 学习的愉悦感
      growth: neutral
      network: core        # 人际：核心 —— 人际魅力/受欢迎
      self: supporting     # 自我：辅助 —— 自我价值感
    relation_role: "魅力发射器——你怎么展现魅力、在哪个领域最吸人。"
    gender_diff:
      female: "你要用金星去吸引人——这是你主动释放的魅力。"
      male: "你被这种类型的女性气质吸引——金星描绘了你理想中的'她'。"

  mars:
    label: "火星"
    label_en: "Mars"
    nature: [action, drive, competition, conquest, sex, courage, anger]
    nature_zh: ["行动力", "驱动力", "竞争", "征服", "性", "勇气", "愤怒"]
    core_verb: "激发行动与胜负欲"
    core_formula: "胜负欲 × {house_domain} × {dignity_adverb}"
    domain_signals:
      career: core         # 事业：核心 —— 竞争力/行动力
      relationship: core   # 感情：核心 —— 激情/性吸引力/怎么追
      wealth: supporting   # 财富：辅助 —— 赚钱的冲劲/竞争性收入
      health: core         # 健康：核心 —— 炎症/外伤/活力
      emotion: supporting  # 情绪：辅助 —— 愤怒/行动驱动的情绪
      family: neutral
      learning: supporting # 学习：辅助 —— 学习冲劲
      growth: neutral
      network: supporting  # 人际：辅助 —— 明面冲突/竞争/表达立场
      self: neutral
    relation_role: "行动引擎——怎么追、怎么争、被什么特质折服。"
    gender_diff:
      female: "火星描绘你被什么男性气质折服——这不是你要去展现的，这是会让你心动、让你服气的。"
      male: "你要用火星去征服——这是你主动展示的行动力与雄性魅力。"

  jupiter:
    label: "木星"
    label_en: "Jupiter"
    nature: [expansion, fortune, benefactor, growth, faith, wisdom, abundance]
    nature_zh: ["扩张", "幸运", "贵人", "成长", "信念", "智慧", "丰盛"]
    core_verb: "扩张机遇、带来贵人"
    core_formula: "扩张 × {house_domain} × {dignity_adverb}"
    domain_signals:
      career: core         # 事业：核心 —— 事业扩张/贵人/多线发展
      relationship: core   # 感情：核心 —— 关系祝福/天时加持
      wealth: core         # 财富：核心 —— 财富扩张/偏财/慷慨进账
      health: supporting   # 健康：辅助 —— 恢复力
      emotion: neutral
      family: neutral
      learning: core       # 学习：核心 —— 高等学识/深造扩张
      growth: core         # 远方：核心 —— 远见/深造/信仰扩张
      network: core        # 人际：核心 —— 贵人/人脉扩展
      self: neutral
    special_rules:
      - name: "multi_thread"
        description: "被木星互溶/接纳的星 → 那个领域不止一条路、不止一份工作、多线程发展"
        condition: "jupiter mutual_reception_or_accepts {planet}"
        tell_user: "你{planet_domain}的能量被木星放大了——这个领域你可能不止做一件事。多线发展是你的常态，不是分心。"
    relation_role: "天时加持——婚姻有没有'自然祝福'，遇到的人有没有质量保障。"
    gender_diff: null

  saturn:
    label: "土星"
    label_en: "Saturn"
    nature: [responsibility, fear, limitation, delay, perseverance, maturity, commitment]
    nature_zh: ["责任", "恐惧", "限制", "延迟", "毅力", "成熟", "承诺"]
    core_verb: "收紧、考验、但咬牙撑住后能长出来"
    core_formula: "责任 × {house_domain} × {dignity_adverb}"
    domain_signals:
      career: core         # 事业：核心 —— 事业格局/长期成就/权威地位
      relationship: core   # 感情：核心 —— 承诺能否落地
      wealth: supporting   # 财富：辅助 —— 长期积累/不动产
      health: core         # 健康：核心 —— 慢性病/骨骼/压力
      emotion: neutral
      family: core         # 家庭：核心 —— 父亲/家庭责任
      learning: supporting # 学习：辅助 —— 需要毅力/延迟回报
      growth: supporting   # 远方：辅助 —— 长期深耕/延迟回报的深造
      network: supporting  # 人际：辅助 —— 权威/责任担当/社团地位
      self: neutral
    special_rules:
      - name: "dignified_saturn_not_malefic"
        description: "入庙/入旺的土星不是凶星——是熟成器，不是阻碍器"
        condition: "saturn in domicile_or_exaltation"
        tell_user: "你的土星入庙/入旺——它不是来给你添堵的，是来帮你'压实'的。土星压过的领域，反而是你一生最稳的底盘。"
    relation_role: "承诺能不能落地——有土星绑定的关系才有时间厚度，但土星刑冲会让关系变成'功课'。"
    gender_diff: null

  uranus:
    label: "天王星"
    label_en: "Uranus"
    nature: [rebellion, change, technology, independence, sudden_change, innovation]
    nature_zh: ["变革", "叛逆", "科技", "独立", "突然变化", "创新"]
    core_verb: "突然打破、带来颠覆"
    core_formula: "变革 × {house_domain}"
    domain_signals:
      career: supporting   # 事业：关联 —— 突然变化/创新/科技行业
      relationship: supporting  # 感情：关联 —— 关系形态不常规（异地/开放式/年龄差大）
      wealth: neutral
      health: neutral
      emotion: neutral
      family: neutral
      learning: supporting # 学习：关联 —— 科技/创新领域
      growth: neutral
      network: supporting  # 人际：关联 —— 社群/创新圈子
      self: supporting     # 自我：关联 —— 独立/挣脱/活出自己
    relation_role: "关系里的'不常规'——天王落7或触7R，婚姻形态不走主流路线。可能体现为异地婚、开放式、年龄差、网络认识，或关系需要更多空间与弹性。"
    gender_diff: null

  neptune:
    label: "海王星"
    label_en: "Neptune"
    nature: [illusion, inspiration, intuition, confusion, faith, art, sacrifice]
    nature_zh: ["幻想", "灵感", "直觉", "迷惑", "信仰", "艺术", "牺牲"]
    core_verb: "消融边界、带来灵感或迷惑"
    core_formula: "消融 × {house_domain}"
    domain_signals:
      career: supporting   # 事业：关联 —— 灵感型职业
      relationship: supporting  # 感情：关联 —— 理想化/浪漫幻想/幻灭/被迷惑
      wealth: neutral
      health: supporting   # 健康：关联 —— 不明原因的症状
      emotion: supporting  # 情绪：关联 —— 梦境/直觉/迷蒙感
      family: neutral
      learning: neutral
      growth: supporting   # 远方：关联 —— 灵性/信仰/艺术
      network: neutral
      self: supporting     # 自我：关联 —— 潜意识/消融边界
    relation_role: "关系里的滤镜——海王触到感情宫位时，你看对方的眼光自带柔焦。要问自己：我爱的是真实的他，还是我想象中的他？"
    gender_diff: null

  pluto:
    label: "冥王星"
    label_en: "Pluto"
    nature: [transformation, power, rebirth, depth, destruction, obsession]
    nature_zh: ["转化", "权力", "重生", "深度", "毁灭", "执念"]
    core_verb: "摧毁然后重生、带来深度执念"
    core_formula: "转化 × {house_domain}"
    domain_signals:
      career: supporting   # 事业：关联 —— 权力/金融/掌控型职业
      relationship: supporting  # 感情：关联 —— 深度绑定/执念/权力博弈（只做关联影响）
      wealth: supporting   # 财富：关联 —— 大额投资/他人钱财/偏财
      health: neutral
      emotion: supporting  # 情绪：关联 —— 深度执念/不放手
      family: neutral
      learning: neutral
      growth: supporting   # 远方：关联 —— 转化/重生
      network: supporting  # 人际：关联 —— 暗中权力斗争/掌控
      self: supporting     # 自我：关联 —— 转化/重生/深度自我
    relation_role: "关系里的深度与执念——冥王触到感情宫位时，爱不够深你觉得没意思，太深了又怕失控。"
    gender_diff: null

# ——— 默认信号等级说明 ———
# core: 该话题的核心判断星——没有它会漏掉关键判断
# supporting: 该话题的辅助星——补充维度，提升解读丰满度
# neutral: 不相关——在默认分析中不抓取，除非用户追问到这个维度
#
# ——— 天海冥只做关联影响（领域引擎 v2） ———
# 天王/海王/冥王不掌宫、不互溶接纳、无传统尊贵，domain_signals 也一律不设 core，
# 仅 supporting/neutral——从星性×落座×落宫做领域染色，不做结构判断。

# ——— 运行时推导 ———
# 每个话题：
#   1. 主宫 → 主宫行星 = lord_of(primary_house)
#   2. 核心星 = domain_signals == core 的行星（从主宫对应的领域中筛选）
#   3. 辅助星 = domain_signals == supporting 的行星（补充维度）
#   4. 特殊规则 = 检查 special_rules 是否触发 → 注入额外判断
