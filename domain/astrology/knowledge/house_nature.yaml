# 宫性规则（House Nature）
#
# 每个宫的完整语义场 + 话题关键词 + 宫间关系（转宫推导）。
# 用于：
#   1. 从用户问题关键词 → 自动确定主宫（primary house）
#   2. 从宫间关系 → 自动确定辅宫（supplementary houses）
#   3. 从转宫视角 → 宫主落Y宫 = X之(Y-X+1) 的含义
#
# 与 houses.yaml 的关系：
#   houses.yaml = 宫位基本定义（角/续/果、天然星座/行星、核心关键词）
#   house_nature.yaml = 扩展语义场 + 话题路由 + 转宫关系表
#   二者互补，不重复。

houses:
  1:
    label: "自我"
    label_en: "Self"
    # 扩展语义场（超出 houses.yaml keywords_zh 的维度）
    themes:
      - "自我形象与人格面具"
      - "生命力与身体"
      - "对外呈现方式"
      - "第一印象与气场"
      - "人生路径的起点"
    # 话题关键词 —— 用户问题匹配到这里
    topic_keywords:
      primary: ["我是谁", "性格", "气质", "长相", "给人的感觉", "自我认知", "命主星"]
      secondary: ["身体", "健康状态", "第一印象"]
    # 宫间关系（转宫视角）
    # "Y之X"：站在Y宫的视角看X宫是什么
    as_derived:
      1: "自我本身——最直接的第一人称呈现"
      2: "自我价值/我的资源——我值什么"
      3: "我的思维/沟通/手足——我怎么想、怎么说"
      4: "我的根/家/内心安全感"
      5: "我的创造/快乐/恋爱——我玩什么、怎么玩"
      6: "我的日常/劳碌/健康——我每天怎么运转"
      7: "我的镜像/另一半/对手——我遇到怎样的'非我'"
      8: "我与他人深度绑定/共享资源——我和别人的钱/信任"
      9: "我的信念/远方/高等学识——我信什么"
      10: "我的事业/公众形象/社会面具——我想成为谁"
      11: "我的社群/朋友/理想——我跟一群人做什么"
      12: "我的潜意识/隐秘/消融——我看不见的自己"

  2:
    label: "正财/价值"
    label_en: "Wealth & Values"
    themes:
      - "正财收入与赚钱能力"
      - "物质资源与消费"
      - "自我价值感与价值观"
      - "拥有的东西（实物与技能）"
      - "对'值不值'的判断"
    topic_keywords:
      primary: ["赚钱", "收入", "工资", "正财", "财运", "钱", "财富", "值钱", "理财", "存钱"]
      secondary: ["价值观", "花钱", "消费", "自我价值"]
    as_derived:
      1: "钱就是我的脸面——收入直接决定自信"
      2: "钱本身——正财的完整形态"
      3: "钱的流动/信息——靠嘴/笔/信息差赚钱"
      4: "钱的根基——家庭资产/房产/安全感与钱绑在一起"
      5: "钱的快乐/风险——投机/恋爱花费/为快乐花钱"
      6: "钱的日常——靠技能/劳作赚钱，花钱在健康上"
      7: "钱之伴侣——合伙财/夫妻共同财产/对方怎么花你的钱"
      8: "钱之暗面——偏财/他人钱财/债务/遗产/投资"
      9: "钱的远见——靠知识/远方/法律赚钱"
