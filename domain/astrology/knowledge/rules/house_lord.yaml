# 宫主星落宫词库（解读文法）
#
# 宫主星是领域的象征星——它落在哪个宫，决定了那个领域在哪个舞台显化。
# 引擎按 (宫位, 落宫) 查表；未列出的组合用 _fallback 合成。
# 语气遵循 docs/interpretation_voice.md。

_fallback:
  base: '{lord_zh}（{house_zh}的守护星）落在{target_house_zh}——{house_keyword}的能量，落在了{target_house_keyword}的领域'

# ---------- 2宫主（财富/价值的象征）落各宫 ----------
'2_1':
  base: 你的财富和你这个人绑在一起——你的价值感直接决定你赚多少钱，自信就是财库
'2_2':
  base: 财富待在自己的宫里——钱来得自然，你对什么东西值多少钱有直觉般的判断力
'2_3':
  base: 你的财富靠嘴和脑子——写作说话信息差短途跑动，知识就是你的现金流
'2_4':
  base: 你的财富和家与不动产有关——钱从家里来，或靠房子土地根基产业慢慢积累
'2_5':
  base: 你的财富和创意投机挂钩——靠才华投资或玩着赚钱，风险偏好比常人高
'2_6':
  base: 你的财富靠日常服务和技能——手艺服务日复一日的劳作，一分耕耘一分收获
'2_7':
  base: 你的财富和伴侣合作绑在一起——另一半带财或合作赚钱，但也意味着钱不是只靠你自己
'2_8':
  base: 你的财富和他人资源深度纠缠——偏财投资遗产贷款共享资产，钱进来出去都大
'2_9':
  base: 你的财富和远方知识有关——靠学问出版跨国事务赚钱，见识越广财路越宽
'2_10':
  base: 你的财富和事业地位直接挂钩——赚得多是因为站得高，名声就是你的资产
'2_11':
  base: 你的财富从圈子里来——靠人脉社群平台粉丝赚钱，一个人赚不了大钱
'2_12':
  base: 你的财富藏在看不见的地方——收入来源隐秘，或钱来得慢，需要在独处时酝酿

# ---------- 5宫主（心动/恋爱的象征）落各宫 ----------
'5_1':
  base: 你的恋爱姿态坦荡又主动——喜欢就大方追，恋爱里你是那个先伸出手的人
'5_2':
  base: 你的心动和值不值绑在一起——喜欢一个人时先看条件，浪漫里有计算，容易把安全感当成爱的信号
'5_3':
  base: 你的心动从聊天开始——能被说得来的人点燃，恋爱里表达和倾听就是你的浪漫语言
'5_4':
  base: 你的心动落在家和归属感里——喜欢的人让你想起家的感觉，恋爱最终要落回柴米油盐的安心
'5_5':
  base: 你的恋爱像一场双人表演——浪漫浓度高、享受过程，但也容易'入戏太深'
'5_6':
  base: 你的心动在日常里长出来——不追求轰轰烈烈，一起做事互相照顾就是你的浪漫
'5_7':
  base: 你的心动和归宿高度一致——你谈恋爱就是奔着认真去的，追到的人往往是能长伴的
'5_8':
  base: 你的心动带着深度和占有——不轻易动心，一动就是全身投入，爱得重也容易怕失去
'5_9':
  base: 你的心动被远方点燃——异地异国不同背景的人最容易吸引你，恋爱里需要距离和新鲜感
'5_10':
  base: 你的心动容易被'优秀'点燃——你容易被有事业、有光环的人吸引，恋爱里也在给自己找目标
'5_11':
  base: 你的心动从朋友堆里冒出来——圈子里的那个人最让你心动，先朋友后恋人，靠共同理想维系
'5_12':
  base: 你的心动总带点隐秘——喜欢的人要么难开口、要么见不得光，恋爱前常有一段独自煎熬

# ---------- 7宫主（伴侣/婚姻的象征）落各宫 ----------
'7_1':
  base: 伴侣像另一个你——自我又主动，关系里你俩都强、都不愿意低头，但彼此很有存在感
'7_2':
  base: 伴侣和你的钱包绑在一起——对方务实、看重价值，感情里安全感很大程度和钱有关
'7_3':
  base: 伴侣多半出现在你身边的人里——同学、邻居、常聊的人，关系靠'说得来'维系
'7_4':
  base: 伴侣是'家'的形状——对方顾家、念旧，你们的感情最终会落回柴米油盐的安稳
'7_5':
  base: 伴侣是从心动开始的——对方浪漫、爱玩，你们是先有火花再谈责任的典型
'7_6':
  base: 伴侣和你的工作/日常纠缠在一起——同事、服务关系、或一个勤恳务实的人，关系带着'互相照顾'的分工感
'7_7':
  base: 伴侣和你高度同构——两个人都把'这段关系'看得极重，关系就是你们共同的舞台
'7_8':
  base: 伴侣带着深度和占有而来——感情常与共同财产、危机、深层信任纠缠，爱得重也怕得深
'7_9':
  base: 伴侣来自更远的地方——异地、异国、不同背景，对方带着理想与见识，关系里需要理解和距离的平衡
'7_10':
  base: 伴侣是事业型的——对方有野心、有社会地位，你们的感情和'面子、成就'脱不开关系
'7_11':
  base: 伴侣从朋友里长出来——先成为朋友再成为伴侣，关系靠共同圈子和理想维系
'7_12':
  base: 伴侣身上有'看不透'的部分——对方可能有隐情、或你们的关系有隐秘的面向，需要你学会相信直觉

# ---------- 8宫主（偏财/他人资源的象征）落各宫 ----------
'8_1':
  base: 他人的资源通过你这个人显化——你天生擅长撬动别人的钱和资源，但风险也扛在自己身上
'8_2':
  base: 偏财和正财打通——别人的钱容易变成你的钱，但也意味着你的价值感和他人深度纠缠
'8_3':
  base: 他人的资源通过沟通和信息流动——靠消息中介牵线搭桥获取偏财，信息就是杠杆
'8_4':
  base: 偏财和家与不动产有关——遗产家族资源或靠房产撬动他人资金，根基里藏着钱
'8_5':
  base: 他人的资源通过创意和投机变现——靠别人的钱投资或用才华撬动偏财，赌性藏在优雅里
'8_6':
  base: 他人的资源在日常服务和劳作里兑现——靠服务他人获取深层信任，钱来得辛苦但扎实
'8_7':
  base: 他人的资源和伴侣合作深度绑在一起——婚姻财合作财，但也是你的就是我的的战场
'8_8':
  base: 偏财待在自己的宫里——你对别人的钱有天然的掌控力，金融保险投资是你的天赋领域
'8_9':
  base: 他人的资源通过远方和知识——跨国投资海外资产或靠学问撬动他人资本
'8_10':
  base: 偏财和事业地位挂钩——靠别人的资源登上高位，或事业本身就是管理他人的钱
'8_11':
  base: 他人的资源通过圈子和平台——靠社群粉丝大众的钱，众筹型偏财
'8_12':
  base: 偏财藏在暗处——隐秘的财务安排幕后资本，或需要独自面对他人资源的黑洞

# ---------- 10宫主（事业/地位的象征）落各宫 ----------
'10_1':
  base: 你的事业就是你这个人——你的个人形象气场存在感直接决定你的社会地位
'10_2':
  base: 你的事业和财富互相成就——站得高自然赚得多，但也容易把事业等同于赚多少
'10_3':
  base: 你的事业靠脑子和嘴——写作教学传播跑动，知识和表达就是你的上升通道
'10_4':
  base: 你的事业从家里长出来——家业根基或在家办公，事业和家的边界模糊
'10_5':
  base: 你的事业和创意表达有关——靠才华作品或把自己展示出去获得地位
'10_6':
  base: 你的事业在日常服务和技能里——不是一步登天，是日复一日的精进和靠谱堆出来的
'10_7':
  base: 你的事业和伴侣合作深度绑在一起——另一半影响你的社会地位，或合作决定事业高度
'10_8':
  base: 你的事业涉及他人的钱和资源——金融投资保险或管理别人的资产，权力藏在钱后面
'10_9':
  base: 你的事业和远大学问有关——学术出版跨国事务，站得高是因为看得远
'10_10':
  base: 事业待在自己的宫里——你对往上走有天然的野心和直觉，社会地位是你核心的人生舞台
'10_11':
  base: 你的事业靠圈子和平台——人脉社群大众影响力，一个人爬不高，一群人把你抬上去
'10_12':
  base: 你的事业有幕后的一面——不追求台前风光，或事业方向需要独自摸索甚至经历一段低谷才找到

