# 引擎会用落宫 arena 再注入"发生在哪个舞台"。
# 语气遵循 docs/interpretation_voice.md。
#
# 键名统一按字母序（mars_moon），引擎负责归一化相位对。
# 未列出的行星对由 _fallback 从行星关键词合成（诚实但更泛）。

_fallback:
  base: '{planet_a_zh}与{planet_b_zh}——{planet_a_keyword}与{planet_b_keyword}的能量互相作用'
