# 转宫关系表（Derived House Meanings）
#
# 任何宫主 X 落宫 Y：derived = (Y - X + 1)，结果≤0则+12。
# 语义读取：查 derived_houses[X][derived]。
#
# 本表只描述宫位间的相对语义关系，用于定位/证据链转述；不生成独立占星结论。

derived_houses:
