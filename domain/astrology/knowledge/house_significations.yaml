# 宫位语义场（House Significations）
#
# 每个宫位是一个"语义场"（多义词），不是单义。同一宫位在不同问题域下
# 激活不同含义；结构质量决定取正面切片还是负面切片。
#
# 字段说明：
#   word        : 该含义（精确描述）
#   domains     : 该含义激活的问题域（career/relationship/wealth/health/emotion/family/learning/self）
#   polarity    : positive / negative / neutral（本身极性，结构调制后会倾斜）
#   intensity   : 语义场基础强度 1-5
#   resonance   : 通俗共鸣词（LLM 转述时锚点，确定性数据，不发明）
#   gated       : tendency（倾向，默认）/ event（事件预言，高门槛）
#   requires_corroboration + corroborate_houses : event 条目需要的强连接收敛数
#
# 解读优先级：P1 倾向切片默认；P2 事件切片需收敛数达标 + 域激活 + 非预言护栏。

house_significations:
  1:
    - word: "自我/个性/存在感"
      domains: [self]
      polarity: neutral
      intensity: 3
      resonance: ["做自己", "存在感"]
    - word: "生命力/精力"
      domains: [health, self]
      polarity: neutral
      intensity: 2
      resonance: ["元气", "活力"]
