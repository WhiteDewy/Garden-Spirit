# 宫位语义场（House Significations）
#
# 每个宫位是一个"语义场"（多义词），不是单义。同一宫位在不同问题域下
# 激活不同含义；结构质量决定取正面切片还是负面切片。
#
# 字段说明：
#   word        : 该含义（精确描述）
#   domains     : 该含义激活的问题域（领域引擎 v2：career/relationship/wealth/health/emotion/
#                 family/learning/growth/network/self；每词 2-3 主域上限，daily 是跨域行运视图不在此表）
#   governors   : 历史字段/人工语义备注；运行时不把它当承载者权威。
#                 当前承载者由实盘宫主、宫内星、planet_nature.domain_signals
#                 与 ConsultCallPlan enrichment 动态解析。保留该字段只为迁移期可读性。
#   polarity    : positive / negative / neutral（本身极性，结构调制后会倾斜）
#   intensity   : 语义场基础强度 1-5
#   resonance   : 通俗共鸣词（LLM 转述时锚点，确定性数据，不发明）
#   gated       : tendency（倾向，默认）/ event（事件预言，高门槛）
#   route_keywords : 路由关键词（体系二定位层使用，只决定看哪个宫/切片，不生成结论）
#   route_secondary: 弱路由词（只作低权重定位兜底）。
#
# 解读优先级：P1 倾向切片默认；P2 事件切片需收敛数达标 + 域激活 + 非预言护栏。

house_significations:
  1:
    - word: "自我/个性/存在感"
      route_keywords: ["我是谁", "性格", "气质", "自我认知", "命主星"]
      domains: [self]
      governors: [sun]
      polarity: neutral
      intensity: 3
      resonance: ["做自己", "存在感"]
    - word: "生命力/精力"
      route_secondary: ["身体", "健康状态"]
      domains: [health, self]
      governors: [sun, mars]
      polarity: neutral
      intensity: 2
      resonance: ["元气", "活力"]
    - word: "外观/第一印象/气场"
      route_keywords: ["长相", "给人的感觉", "第一印象"]
      domains: [career, relationship]
      governors: [1st_lord]
      polarity: neutral
      intensity: 2
      resonance: ["气场", "第一印象"]
  2:
    - word: "正财/收入/积累"
