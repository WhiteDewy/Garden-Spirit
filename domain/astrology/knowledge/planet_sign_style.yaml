# 行星 × 落座 风格描述（占星师经验库）
#
# 每颗星落在不同星座 = "这颗星的能量带着这个星座的质地来表达"。
# 落座 = 你怎么展现（金星）/ 你怎么行动（火星）/ 你怎么获得满足（月亮）...的底色。
# 格式: <planet>: { <sign>: "落座风格描述" }
# 120 条（10 行星 × 12 星座）。占星师可按梦老师风格逐条调优，不改代码。
# 兜底: 未写到的组合由代码用 行星keywords × 星座keywords 拼接。

sun:
  aries: "自我表达像战士——直接、热烈、抢在最前面，天生带冲劲，但容易冲动、没耐心等"
  taurus: "沉稳发光——不求快，但求稳。被认可的方式是实实在在的积累，一旦认定就很固执"
  gemini: "自我表达像风——思维快、话多、到处收集兴趣。发光的方式是让所有人看见他头脑转得多快"
  cancer: "自我像壳里的光——表面柔软、需要安全感，内心有一整片情感海洋。发光方式是照顾人"
  leo: "天生要舞台——被看见、被认可就是他的燃料。大方、骄傲，但也需要持续的掌声"
  virgo: "自我像打磨过的工具——追求完美、注重细节。发光方式是把自己做到无可挑剔"
  libra: "自我像一面镜子——在意关系里的平衡与被喜欢。发光方式是让人相处舒服，但容易为讨好别人失去自己"
  scorpio: "自我像深水——不爱暴露，但一旦投入就极深。发光方式是让人感到他的决断和洞察"
  sagittarius: "自我像箭——向往远方、追求意义和自由。发光方式是讲出宏大而真诚的信念"
  capricorn: "自我像山——内敛、有野心、靠成果说话。发光方式是不声不响地爬到别人够不着的地方"
  aquarius: "自我像信号塔——独立、有个性、为理念发声。发光方式是与众不同、不随大流"
  pisces: "自我像水——边界模糊、共情极强、活在感受里。发光方式是用想象和温柔打动别人，但也容易消散"

moon:
  aries: "情绪来得快去得快——需要即刻反馈，被认可、被回应才安心。生气也快，哄也快"
  taurus: "情绪需要实在的踏实感——吃得安稳、账上有钱、身体被照顾，情绪就稳。改变很慢"
  gemini: "情绪需要交流——心里有事一定要说出来。情绪跟着话题跑，多变但真实"
  cancer: "情绪像退潮的海——安全感是第一需求。滋养别人、也需要被滋养，情绪写满在脸上"
  leo: "情绪需要被看见——被夸、被重视就满血复活。受了冷落会格外受伤，但要强不轻易示弱"
  virgo: "情绪需要秩序——东西乱、计划乱、被人说不够好，就焦虑。照顾别人时最有满足感"
  libra: "情绪需要和谐——最怕冲突和冷场。为了气氛好会先低头，但委屈攒久了会突然爆发"
  scorpio: "情绪是深水炸弹——表面平静，内里惊涛骇浪。信任极慢，一旦受伤，翻脸也彻底"
  sagittarius: "情绪需要自由——被困住、被管束就难受。乐观是真乐观，但遇到打击会想逃离"
  capricorn: "情绪被克制——不容易示弱，习惯自己扛。被承认努力、看到成果时最有安全感"
  aquarius: "情绪需要空间——太黏会烦。理性地处理感受，喜欢有距离的陪伴，不喜欢情绪绑架"
  pisces: "情绪像海绵——吸进所有人的感受，分不清是自己的还是别人的。容易共情，也容易内耗"

mercury:
  aries: "说话像冲锋——反应快、想到就讲，直接。但容易抢话、话出口才发现没经过大脑"
  taurus: "说话慢而实——想清楚才开口，不喜欢被催。表达有分量，但偶尔固执到听不进道理"
  gemini: "思维是飞鸟——反应极快、话题跳跃、什么都能聊。信息收集器，但容易浅尝辄止"
  cancer: "表达绕着感受走——说话委婉、顾念人情。记得住别人的细节，但也容易多想"
  leo: "表达要舞台——说话生动、爱讲故事、自带感染力。被倾听时会讲得更好，被打断会不爽"
  virgo: "思维是精密仪器——关注细节、讲究逻辑、爱列清单。表达精准，但容易过度分析"
  libra: "表达求优雅——斟酌措辞、考虑对方感受。会协商、会圆场，但容易为了好听不说重点"
  scorpio: "思维直插深处——洞察力强、话不多但句句要害。一旦决定说出口，就是真正的决心"
  sagittarius: "思维是开阔的大道——爱讲道理、讲远方、讲人生意义。表达真诚，但容易一杆子打翻"
  capricorn: "表达求实效——话不多、每一句都有目的。条理清晰，但显得有点冷、不够活泼"
  aquarius: "思维是奇点——点子怪、角度新、不为合群改口。表达直率，有时显得疏离"
  pisces: "思维是雾——直觉大于逻辑，常有灵感但说不清来源。表达诗意，但容易含糊其辞"

venus:
  aries: "打直球——喜欢就追，不喜欢就撤，不拖泥带水。被热情点燃，也怕平淡"
  taurus: "物质滋养——送礼物、做好吃的、用身体的舒适表达爱。慢热，但一旦认定很持久"
  gemini: "陪你玩、陪你聊——精神上的趣味比物质重要。喜欢新鲜感，怕无聊"
  cancer: "慢慢来——害羞、腼腆、先试探。喜欢被温柔照顾，也用心照顾对方"
  leo: "要面子也要被捧——喜欢盛大浪漫、被公开承认。出手大方，也享受被欣赏"
  virgo: "用行动爱——细心地记住你的喜好、为你打点。爱得克制，批评也是关心"
  libra: "爱得体面——在意颜值、品味、相处氛围。善于讨好，但容易为别人失去自己"
  scorpio: "爱得极致——占有欲、掌控欲、深度的信任。要么不爱，要么深不见底"
  sagittarius: "爱要自由——喜欢一起旅行、一起探索。乐观直接，但怕被绑住"
  capricorn: "爱得务实——把承诺当责任，行动胜过甜言。慢，但可靠到让人安心"
  aquarius: "爱要特别——讨厌老套的浪漫，喜欢灵魂层面的共鸣。独立，也需要空间"
  pisces: "爱是幻觉也是救赎——极度浪漫、为爱付出。容易理想化对方，也容易受伤"

mars:
  aries: "行动是冲锋号——想就做，冲劲十足。直来直去，但也容易三分钟热度"
  taurus: "行动是慢牛——一旦决定就雷打不动。爆发力在耐力里，倔起来九头牛拉不回"
  gemini: "行动是闪电——快、多变、同时开好几个头。脑子转得比手快，容易虎头蛇尾"
  cancer: "行动绕着情绪走——为了守护家人可以拼命，但平时习惯先试探。隐忍型的狠"
  leo: "行动要被人看见——做事有魄力、爱当主角。被激将会热血上头，被忽视会泄气"
  virgo: "行动讲方法——有计划、有步骤、追求效率。做事稳，但容易钻牛角尖、苛求完美"
  libra: "行动要权衡——出手前先掂量利弊和关系。善协调，但容易犹豫不决、错过时机"
  scorpio: "行动是暗涌——不声不响地布局，一旦出手就是致命一击。报复心也重"
  sagittarius: "行动要意义——为信念和远方而战，行动力被理想点燃。但不愿被束缚，容易半途转向"
  capricorn: "行动是爬坡——每一步都扎实，肯下笨功夫。为长期目标忍耐，最擅长坚持"
  aquarius: "行动反常规——别人怎么走他偏不走。为理想异动，行动方式常让人看不懂"
  pisces: "行动靠直觉——顺势而为，不硬顶。有柔劲，但容易拖延、逃避硬碰硬"

jupiter:
  aries: "运气靠冲——敢第一个上，机会常给冒险的人。乐观外放，但容易高估自己"
  taurus: "运气靠积累——机会来自稳步经营。有福气、懂得享受，但舍不得冒险"
  gemini: "运气靠信息——贵人来自交流、来自多知道一点。见多识广，但容易贪多嚼不烂"
  cancer: "运气靠人缘——家族、旧友、熟悉的人带来机会。有共情的天赋，但也容易过度付出"
  leo: "运气靠被看见——舞台越大人气越旺，贵人多来自欣赏你的人。自信是最大运气"
  virgo: "运气靠服务——把事做精细，机会自然来。会鉴别、会挑，但容易错过大的"
  libra: "运气靠关系——合作、结盟、把关系处理漂亮就有机会。擅长借力，但怕决断"
  scorpio: "运气靠深度——资源、遗产、隐藏的机会。眼光毒、能翻盘，但疑心重易错过"
  sagittarius: "运气是主场——远行、学习、信仰带来好运。天生乐观，机会在路上"
  capricorn: "运气靠责任——扛得住就有回报。成长型机会多，但年轻时较慢"
  aquarius: "运气靠圈子——朋友、社团、新思想带来机会。有远见，但机会常来得突然"
  pisces: "运气靠直觉——说不清来源的福气、灵感、帮助。善用慈悲，但容易迷糊错过"

saturn:
  aries: "怕失败但偏要冲——用行动硬扛压力。年轻时急躁，成熟后把纪律磨成了火"
  taurus: "怕变动所以要稳固——靠积累和坚持建立安全感。固执是铠甲也是枷锁"
  gemini: "怕说错所以反复确认——思维被纪律约束。学习上有耐心，但容易自我怀疑"
  cancer: "怕被抛弃所以筑墙——家庭既是软肋也是力量。外表硬，内里要安全感"
  leo: "怕不被认可所以拼命证明——自尊心强，被否定会格外受伤。扛责能力是练出来的"
  virgo: "怕出错所以苛求完美——对自己最狠。标准高，操心多，是最靠谱的操盘手"
  libra: "怕失衡所以权衡——为公平和承诺负责。婚恋里有责任感，但犹豫是软肋"
  scorpio: "怕失去所以掌控——把恐惧变成深度控制。最能扛事，也最不肯放手"
  sagittarius: "怕困住所以找意义——责任压身时想逃，但认定了就比谁都坚持"
  capricorn: "压力是燃料——与生俱来的自律和野心。最擅长把恐惧变成攀登的台阶"
  aquarius: "怕被规则困住——反叛但负责任。用自己的方式扛事，不合群但有担当"
  pisces: "怕现实所以躲进想象——把责任变成艺术或信仰。慈悲但容易逃避硬现实"

uranus:
  aries: "创新是冲锋——第一个试新东西，打破常规干脆利落。但容易冲动革新、不留后路"
  taurus: "创新是拆旧——最顽固的领域里做最彻底的改变。一旦决定变化，就雷打不动"
  gemini: "创新是点子风暴——想法多、角度怪，到处串联新概念。表达前卫，但容易飘"
  cancer: "创新是重组家庭——把'家'改造成自己的定义。情绪需要独立的边界"
  leo: "创新是个人秀——特立独行当舞台。要活成独特的样子，拒绝平庸的掌声"
  virgo: "创新是重构系统——把流程、方法全部重做。是效率领域的革命家"
  libra: "创新是重塑关系——对'关系应该怎样'有自己一套。忽冷忽热，追求新型连接"
  scorpio: "创新是深层变革——把旧我彻底推翻重来。洞察隐藏结构，变化极具穿透力"
  sagittarius: "创新是远征——用新思想、新远方冲开旧框。信仰独立，拒绝被定义"
  capricorn: "创新是改规则——在既有体系里颠覆规则。打破权威，也建立新秩序"
  aquarius: "创新是本能——为群体、为理念而变。天生走在时代前面，但个人情感疏离"
  pisces: "创新是做梦——把想象变成现实。灵性直觉极强，但也容易活在幻想里"

neptune:
  aries: "冲动地理想化——为梦想孤注一掷。有灵感但容易看不清现实，先冲了再说"
  taurus: "把美变成实在——用感官体验世界。对艺术、物质有直觉，但容易沉溺享受"
  gemini: "把想象说出口——表达有幻觉色彩，灵感多。但容易言过其实、自欺欺人"
  cancer: "把直觉当安全感——极度敏感、能读懂人心。容易过度共情、边界模糊"
  leo: "把理想演出来——浪漫化自我，渴望被当神。有魅力，但容易自我陶醉"
  virgo: "把拯救当使命——过度关心细节里的痛苦。想治愈一切，反而累垮自己"
  libra: "把关系理想化——美化伴侣和合作。容易看不清对方的缺点，也怕打破幻象"
  scorpio: "把深处变成幻境——对潜意识和人性有直觉。有灵性穿透力，也容易被执念吞噬"
  sagittarius: "把信仰当远方——对宗教、哲学有感应。追求宏大意义，但容易陷进空想"
  capricorn: "把梦想做成事——现实的理想主义者。能落地，但容易压抑想象"
  aquarius: "把未来当信仰——对人道理想有直觉。能看到趋势，但活得太超前"
  pisces: "把边界融化——共情、灵性、艺术的天赋全在这。敏感至极，最怕现实挤压"

pluto:
  aries: "变革是夺权——要赢、要重生，用强势冲破一切。有爆发力，也有毁灭欲"
  taurus: "变革是掌控资源——对金钱、身体、价值的执念极深。不放手则已，一放手就是彻底重来"
  gemini: "变革是看穿语言——对信息的操控和深度极敏感。有看穿人心的天赋，说话也伤人"
  cancer: "变革是情绪风暴——深层情绪掌控一切。家庭是战场也是疗愈处，执念深"
  leo: "变革是夺舞台——要成为中心的中心。占有欲强，被背叛会彻底翻脸"
  virgo: "变革是重构细节——对'如何运转'有强迫式洞察。能重塑系统，也容易过度控制"
  libra: "变革是关系的重生——爱恨都到极致。关系里的掌控和占有是课题"
  scorpio: "变革是本能——重生、死亡、转化的代言。洞察力极强，也极难信任"
  sagittarius: "变革是推翻信仰——对真理的执念。会把旧信念烧掉重建，走得义无反顾"
  capricorn: "变革是夺权位——对地位和结构有深刻的欲望。能用权力重塑一切"
  aquarius: "变革是颠覆群体——对集体意识有改造力。要打破旧秩序，建立新联盟"
  pisces: "变革是溶解——把执念消融，也在逃避里自我毁灭。灵性重生或沉沦一线之间"
