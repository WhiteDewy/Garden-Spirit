    - "学业时机（法达水/木子限 + 行运）"
    - "专注力与压力（水土相位 + 6宫）"
  core_houses: [3, 9, 10]
  core_planets: [mercury, jupiter, sun, moon]
  house_lords: [3, 9]
  aspect_pairs:
    - [mercury, jupiter]
    - [mercury, mars]
    - [mercury, venus]
    - [mercury, saturn]

daily:
  domain: daily
  label_zh: "每日运势"
  description: "今天运势、今日运势、运势如何"
  base_tasks:
    - module: Daily
      priority: high
      params: {}
  conditional_tasks: []
  focus_dimensions:
    - "当日行运扫描（行运行星与本命盘的相位）"
    - "月亮当天落宫与情绪基调"
  core_houses: [1]
  core_planets: [moon, sun]
  house_lords: []
  aspect_pairs: []
