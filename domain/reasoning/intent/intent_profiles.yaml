# 意图分析配置（Intent Profiles）
#
# 每个 IntentDomain 的分析配方——base_tasks（必修，安全网）、
# conditional_tasks（触发词 → 附加模块）、focus_dimensions（LLM 理解提示）。
#
# IntentDecomposer 使用此文件确保：
#   1. 必修模块永不丢失（即使 LLM 失败）
#   2. 触发词命中时自动追加模块
#   3. LLM 知道该领域的核心占星结构
#
# 新增领域 = 新增一段 YAML，不改代码。

career:
  domain: career
  label_zh: "职业"
  description: "职业方向、工作状态、换工作、职业倦怠、升职、创业"
  base_tasks:
    - module: CareerStrength
      priority: high
      params: {}
    - module: Timing
      priority: medium
      params: { window_months: 6 }
  conditional_tasks:
    - triggers: ["累", "疲惫", "倦怠", "压力大", "撑不住", "没动力", "工作没意思", "上班跟上坟", "受不了"]
      add_modules:
        - module: Psychology
          priority: high
          params: {}
        - module: Emotion
          priority: medium
          params: {}
    - triggers: ["换工作", "跳槽", "辞职", "离职", "换职业", "换份工作", "转行"]
      add_modules:
        - module: Opportunity
          priority: medium
          params: {}
        - module: Risk
          priority: medium
          params: {}
        - module: Finance
          priority: medium
          params: {}
    - triggers: ["创业", "开公司", "自己干", "单干", "做生意"]
      add_modules:
        - module: Risk
          priority: high
          params: {}
        - module: Finance
          priority: high
          params: {}
        - module: Opportunity
          priority: medium
          params: {}
    - triggers: ["升职", "晋升", "升迁", "加薪", "涨薪"]
      add_modules:
        - module: Opportunity
          priority: high
          params: {}
        - module: Finance
          priority: medium
          params: {}
  focus_dimensions:
    - "职业方向与天赋（10宫/6宫/2宫 + 10R状态）"
    - "当前事业阶段是蓄力还是发力（10R落宫 + 法达大运）"
    - "时机窗口（法达子限 + 行运火星/木星/土星触达）"
    - "心理与情绪压力（月亮/12宫/6宫 + 月土相位）"
    - "核心竞争力与变现能力（2宫/11宫 + 木星/水星触达）"
  core_houses: [10, 6, 2, 1]
  house_lords: [10, 6, 2]
  aspect_pairs:
    - [sun, saturn]
    - [mars, saturn]
    - [jupiter, saturn]
    - [moon, saturn]
    - [mars, jupiter]
  known_subdomains:
    ChangeJob:
      extra_houses: [1, 8]
      extra_planets: [uranus]
    Burnout:
      extra_houses: [12]
      extra_planets: [moon, neptune]

relationship:
  domain: relationship
  label_zh: "感情"
  description: "感情状态、恋爱、婚姻、复合、伴侣特征"
  base_tasks:
    - module: PartnerTraits
      priority: high
      params: {}
    - module: RelationshipStatus
      priority: medium
      params: {}
  conditional_tasks:
    - triggers: ["结婚", "嫁", "娶", "求婚", "婚姻", "订婚", "承诺"]
      add_modules:
        - module: MarriagePotential
          priority: high
          params: {}
        - module: Timing
          priority: medium
          params: { window_months: 12 }
    - triggers: ["复合", "和好", "挽回", "分手后", "分手", "回头"]
      add_modules:
        - module: Psychology
          priority: high
          params: {}
        - module: Emotion
          priority: medium
          params: {}
    - triggers: ["合适", "合不合适", "适不适合", "能不能在一起"]
      add_modules:
        - module: Timing
          priority: medium
          params: { window_months: 6 }
  focus_dimensions:
    - "恋爱模式与吸引类型（金火月 + 5宫/5R）"
    - "婚姻与长期承诺潜力（7宫/7R + 金星/土星相位）"
    - "感情时机窗口（法达金/火/月子限 + 行运）"
    - "感情中的心理模式（月亮 + 金土相位揭示的不安全感）"
  core_houses: [5, 7, 8]
  house_lords: [5, 7]
  aspect_pairs:
    - [venus, mars]
    - [moon, venus]
    - [mars, moon]
    - [venus, saturn]
    - [moon, saturn]
    - [sun, saturn]
  known_subdomains:
    PartnerTraits:
      extra_houses: [1]
      extra_planets: [sun]
    Status:
      extra_houses: [1]
      extra_planets: []
    Commitment:
      extra_houses: [4]
      extra_planets: [jupiter, saturn]
    Reconcile:
      extra_houses: [12]
      extra_planets: [neptune]

