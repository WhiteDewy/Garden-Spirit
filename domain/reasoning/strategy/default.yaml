# 各意图领域的默认策略（兜底）
# 当某 Intent 没有专属策略时，用对应领域的默认策略。
# 结构：intent 引用 → 策略定义

career.default:
  description: "职业领域默认分析：职业强度 + 机会时机 + 风险 + 心理"
  required_analysis:
    - module: CareerStrength
      priority: high
      params: {}
    - module: Timing
      priority: medium
      params: { window_months: 6 }
    - module: Risk
      priority: low
      params: {}
    - module: Psychology
      priority: low
      params: {}
  evidence_rules:
    positive_weight: 1.0
    negative_weight: 0.8
    min_confidence: 0.3
    conflict_threshold: 0.15
  model_dependencies:
    CareerStrength: []
    Timing: []
    Risk: [CareerStrength]
    Psychology: [CareerStrength]

