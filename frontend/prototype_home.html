<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星灵花园 · 首页氛围原型 (P0)</title>
<style>
  /* ============================================================
     P0 首页氛围原型 —— 昼夜双生
     白天：蓝天白云 / 夜晚：星空萤火
     金色星灵 = 用户链接的星灵（方案A 用户主权）
     ◐ 微光 = 今日行运星灵来访
     本文件是独立 HTML，双击即可在浏览器查看，不走 uni-app 构建。
     ============================================================ */

  :root {
    /* 昼夜共用：金色（星灵/成长） */
    --gold: #FFD98E;
    --gold-deep: #FFC96B;
    /* 白天 */
    --day-sky-1: #7EC8F7;
    --day-sky-2: #B7E3FC;
    --day-sky-3: #EAF7FF;
    --day-cloud: rgba(255, 255, 255, 0.92);
    --day-grass-1: #A8D67A;
    --day-grass-2: #6EA844;
    --day-grass-3: #4E7F2E;
    --day-text: #2F4F3A;
    --day-text-soft: rgba(47, 79, 58, 0.72);
    /* 夜晚 */
    --night-sky-1: #0B1E38;
    --night-sky-2: #132B47;
    --night-sky-3: #0D1F1A;
    --night-grass-1: #1D4436;
    --night-grass-2: #14332A;
    --night-text: #E8F5E9;
    --night-text-soft: rgba(232, 245, 233, 0.62);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "HarmonyOS Sans", "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
    background: var(--day-sky-1);
    transition: background 1.2s ease;
  }

  /* ============================================================
     天空层
     ============================================================ */
  .sky {
    position: relative;
    height: 55%;
    background: linear-gradient(180deg, var(--day-sky-1) 0%, var(--day-sky-2) 55%, var(--day-sky-3) 100%);
    transition: background 1.2s ease;
    overflow: hidden;
  }

  /* 云朵：模糊白色椭圆，缓慢漂移 */
  .cloud {
    position: absolute;
    background: var(--day-cloud);
    border-radius: 999px;
    filter: blur(2px);
    opacity: 0.9;
    animation: drift linear infinite;
  }
  .cloud::before, .cloud::after {
    content: "";
    position: absolute;
    background: inherit;
    border-radius: 50%;
  }
  .cloud.c1 { width: 180px; height: 52px; top: 18%; animation-duration: 60s; }
  .cloud.c1::before { width: 90px; height: 90px; top: -40px; left: 30px; }
  .cloud.c1::after  { width: 70px; height: 70px; top: -26px; left: 95px; }
  .cloud.c2 { width: 240px; height: 66px; top: 36%; animation-duration: 90s; animation-delay: -30s; opacity: 0.75; }
  .cloud.c2::before { width: 120px; height: 120px; top: -55px; left: 40px; }
  .cloud.c2::after  { width: 92px; height: 92px; top: -36px; left: 130px; }
  .cloud.c3 { width: 130px; height: 40px; top: 60%; animation-duration: 75s; animation-delay: -50s; opacity: 0.6; }
  .cloud.c3::before { width: 66px; height: 66px; top: -30px; left: 22px; }
  .cloud.c3::after  { width: 50px; height: 50px; top: -20px; left: 72px; }

  @keyframes drift {
    0%   { transform: translateX(-30vw); }
    100% { transform: translateX(120vw); }
  }

  /* 夜晚星星（复用 Starfield 思想：小金星点闪烁） */
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.7); }
    50%      { opacity: 0.95; transform: scale(1); }
  }

  /* 夜晚月亮（真实月相位会由后端角度驱动；原型用上弦月示意） */
  .night-moon {
    position: absolute;
    top: 9%;
    right: 12%;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFF7DC, #FFE9B0);
    box-shadow: 0 0 40px rgba(255, 233, 176, 0.55), 0 0 90px rgba(255, 233, 176, 0.25);
    opacity: 0;
    transition: opacity 1.4s ease;
  }

  /* 白天太阳 */
  .day-sun {
    position: absolute;
    top: 8%;
    right: 12%;
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #FFF6CE, #FFD97A);
    box-shadow: 0 0 50px rgba(255, 217, 122, 0.7);
    opacity: 0;
    transition: opacity 1.4s ease;
  }

  /* 问候与今日星象 */
  .greeting {
    position: absolute;
    top: 12%;
    left: 0;
    right: 0;
    text-align: center;
    z-index: 5;
  }
  .greeting .hello {
    color: var(--day-text);
    font-size: 34px;
    font-weight: 600;
    letter-spacing: 6px;
    transition: color 1.2s ease;
  }
  .greeting .hint {
    margin-top: 10px;
    color: var(--day-text-soft);
    font-size: 15px;
    letter-spacing: 1px;
    transition: color 1.2s ease;
  }

  /* 今日星象卡（月相 + 月亮落座 + 一句 Domain 建议） */
  .sky-card {
    position: absolute;
    bottom: 22px;
    left: 20px;
    right: 20px;
    z-index: 5;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: 22px;
    padding: 14px 18px;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(80, 130, 120, 0.18);
    transition: background 1.2s ease, border-color 1.2s ease;
  }
  .night .sky-card {
    background: rgba(13, 31, 26, 0.6);
    border-color: rgba(255, 217, 142, 0.25);
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
  }
  /* 上弦月 SVG 月牙 */
  .moon-icon svg { display: block; filter: drop-shadow(0 0 10px rgba(255, 233, 176, 0.6)); }
  .sky-card .moon-title {
    color: var(--day-text);
    font-size: 17px;
    font-weight: 600;
    transition: color 1.2s ease;
  }
  .sky-card .moon-sub {
    margin-top: 3px;
    color: var(--day-text-soft);
    font-size: 13px;
    transition: color 1.2s ease;
  }
  .night .sky-card .moon-title { color: var(--night-text); }
  .night .sky-card .moon-sub { color: var(--night-text-soft); }

  /* ============================================================
     花园层
     ============================================================ */
  .garden {
    position: relative;
    height: 45%;
    background: linear-gradient(180deg, var(--day-grass-1) 0%, var(--day-grass-2) 40%, var(--day-grass-3) 100%);
    transition: background 1.2s ease;
    overflow: hidden;
  }

  /* 地平线柔光分隔 */
  .garden::before {
    content: "";
    position: absolute;
    top: -1px;
    left: 0; right: 0;
    height: 40px;
    background: linear-gradient(180deg, transparent, rgba(255,255,255,0.25));
    pointer-events: none;
  }

  /* 小花：emoji 点阵占位（P1 换成透明 PNG） */
  .flower { position: absolute; font-size: 20px; opacity: 0.85; animation: sway ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(7deg); } }
  .flower.f1 { bottom: 26%; left: 6%; animation-duration: 3.2s; }
  .flower.f2 { bottom: 18%; left: 16%; font-size: 15px; animation-duration: 2.6s; }
  .flower.f3 { bottom: 30%; left: 24%; animation-duration: 3.8s; }
  .flower.f4 { bottom: 15%; left: 33%; font-size: 14px; animation-duration: 2.9s; }
  .flower.f5 { bottom: 24%; left: 42%; animation-duration: 3.4s; }
  .flower.f6 { bottom: 16%; left: 52%; font-size: 16px; animation-duration: 2.7s; }
  .flower.f7 { bottom: 28%; left: 60%; animation-duration: 3.6s; }
  .flower.f8 { bottom: 14%; left: 70%; font-size: 15px; animation-duration: 3.1s; }
  .flower.f9 { bottom: 22%; left: 80%; animation-duration: 2.8s; }
  .flower.f10{ bottom: 30%; left: 90%; font-size: 17px; animation-duration: 3.5s; }

  /* 蝴蝶：emoji 占位 + 路径漂移（P1 换透明 PNG） */
  .butterfly { position: absolute; font-size: 22px; z-index: 4; opacity: 0.9; }
  .butterfly.b1 { animation: fly1 16s ease-in-out infinite; }
  .butterfly.b2 { animation: fly2 22s ease-in-out infinite 2s; font-size: 17px; opacity: 0.7; }
  @keyframes fly1 {
    0%   { transform: translate(0, 0) scale(1); }
    25%  { transform: translate(38vw, -28px) scale(0.94); }
    50%  { transform: translate(70vw, 10px) scale(1.04); }
    75%  { transform: translate(40vw, 26px) scale(0.96); }
    100% { transform: translate(0, 0) scale(1); }
  }
  @keyframes fly2 {
    0%   { transform: translate(100vw, 20px) scale(0.9); }
    30%  { transform: translate(60vw, -22px) scale(1.05); }
    60%  { transform: translate(30vw, 16px) scale(0.95); }
    100% { transform: translate(-10vw, 30px) scale(1); }
  }

  /* 萤火虫（夜晚）：金色光点闪烁 */
  .firefly {
    position: absolute;
    width: 6px; height: 6px;
    background: radial-gradient(circle, #FFF7D6, var(--gold-deep));
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(255, 217, 142, 0.9);
    opacity: 0;
    animation: firefly 5s ease-in-out infinite;
  }
  @keyframes firefly {
    0%, 100% { opacity: 0; transform: translate(0, 0); }
    50%      { opacity: 0.95; transform: translate(20px, -18px); }
  }
  .firefly.ff1 { bottom: 22%; left: 8%; animation-delay: 0s; }
  .firefly.ff2 { bottom: 14%; left: 30%; animation-delay: 1.3s; }
  .firefly.ff3 { bottom: 26%; left: 55%; animation-delay: 2.1s; }
  .firefly.ff4 { bottom: 12%; left: 72%; animation-delay: 0.7s; }
  .firefly.ff5 { bottom: 20%; left: 90%; animation-delay: 3s; }

  /* ============================================================
     星灵：用户链接的星灵（方案A 用户主权）
     ============================================================ */
  .spirit {
    position: absolute;
    left: 50%;
    bottom: 26%;
    transform: translateX(-50%);
    z-index: 6;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: opacity 0.6s ease;
  }
  .spirit .orb {
    position: relative;
    width: 108px; height: 108px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #FFFDF2, #FFE9B8 45%, #FFC96B 78%, #E8A83F 100%);
    box-shadow:
      0 0 0 8px rgba(255, 233, 184, 0.35),
      0 0 40px rgba(255, 217, 142, 0.85),
      0 0 90px rgba(255, 217, 142, 0.4);
    animation: breathe 4.5s ease-in-out infinite;
  }
  .spirit .orb .glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    filter: drop-shadow(0 2px 6px rgba(180, 120, 20, 0.4));
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.045); }
  }

  /* 光尘粒子环绕星灵 */
  .spirit .dust {
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #FFF6D6;
    box-shadow: 0 0 8px rgba(255, 246, 214, 0.95);
    animation: dust 4s ease-in-out infinite;
  }
  .spirit .dust.d1 { top: -12px; left: 20px; animation-delay: 0s; }
  .spirit .dust.d2 { top: 6px;  right: -14px; animation-delay: 1.1s; }
  .spirit .dust.d3 { bottom: -10px; left: 8px; animation-delay: 2.2s; }
  @keyframes dust {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0.6); }
    50%      { opacity: 1; transform: translateY(-14px) scale(1); }
  }

  .spirit .s-name {
    margin-top: 12px;
    color: #FFFDF4;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 3px;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }
  .spirit .s-heal {
    margin-top: 3px;
    color: rgba(255, 253, 244, 0.85);
    font-size: 12px;
    letter-spacing: 1px;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.3);
  }
  .spirit .s-line {
    margin-top: 8px;
    color: rgba(255, 253, 244, 0.95);
    font-size: 14px;
    background: rgba(0, 0, 0, 0.22);
    padding: 6px 14px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .spirit .tap-hint {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(255, 253, 244, 0.6);
    letter-spacing: 1px;
  }

  /* 今日行运星灵：旁边一抹微光 + 来访提示 */
  .visit {
    position: absolute;
    right: 16%;
    bottom: 30%;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    opacity: 0.85;
  }
  .visit .v-orb {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 36%, #EAF6FF, #B8DCF5 55%, #6FAFD8 100%);
    box-shadow: 0 0 22px rgba(140, 200, 255, 0.8);
    animation: breathe 3.6s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    opacity: 0.82;
  }
  .visit .v-note {
    margin-top: 6px;
    font-size: 11px;
    color: rgba(255, 253, 244, 0.75);
    text-shadow: 0 1px 5px rgba(0, 0, 0, 0.3);
    letter-spacing: 1px;
  }

  /* ============================================================
     底部 tab
     ============================================================ */
  .tabbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 66px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: rgba(255, 255, 255, 0.75);
    backdrop-filter: blur(16px);
    border-top: 1px solid rgba(255, 255, 255, 0.6);
    z-index: 50;
    transition: background 1.2s ease;
  }
  .night .tabbar {
    background: rgba(13, 31, 26, 0.78);
    border-top-color: rgba(255, 217, 142, 0.12);
  }
  .tab { font-size: 13px; color: var(--day-text-soft); text-align: center; padding: 4px 18px; transition: color 1.2s ease; }
  .night .tab { color: var(--night-text-soft); }
  .tab .ic { font-size: 20px; display: block; margin-bottom: 2px; }
  .tab.active { color: var(--day-text); font-weight: 600; }
  .night .tab.active { color: var(--night-text); }
  .tab .dot {
    position: relative;
  }
  .tab .dot::after {
    content: "";
    position: absolute;
    top: 2px; right: -8px;
    width: 7px; height: 7px;
    background: #EF5350;
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(239, 83, 80, 0.6);
  }

  /* ============================================================
     昼夜切换按钮
     ============================================================ */
  .toggle {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 100;
    font-size: 12px;
    color: var(--day-text);
    background: rgba(255, 255, 255, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.7);
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    backdrop-filter: blur(6px);
    transition: color 1.2s ease;
  }
  .night .toggle { color: var(--night-text); background: rgba(0,0,0,0.25); border-color: rgba(255,255,255,0.15); }

  /* 夜晚模式的天空元素显示切换 */
  .star, .firefly, .night-moon { display: none; }
  .night .star, .night .firefly, .night .night-moon { display: block; }
  .night .cloud, .night .day-sun, .night .butterfly, .night .flower { display: none; }
  .night .day-sun { display: none; }
  .night .sky { background: linear-gradient(180deg, var(--night-sky-1) 0%, var(--night-sky-2) 55%, var(--night-sky-3) 100%); }
  .night .garden { background: linear-gradient(180deg, var(--night-grass-1) 0%, var(--night-grass-2) 100%); }
  .night .greeting .hello { color: var(--night-text); }
  .night .greeting .hint { color: var(--night-text-soft); }

  .note {
    position: fixed;
    bottom: 76px;
    left: 0; right: 0;
    text-align: center;
    font-size: 11px;
    color: rgba(0,0,0,0.4);
    z-index: 60;
    letter-spacing: 0.5px;
  }
  .night .note { color: rgba(255,255,255,0.4); }
</style>
</head>
<body>
  <button class="toggle" onclick="document.body.classList.toggle('night'); this.textContent = document.body.classList.contains('night') ? '☀ 切到白天' : '☾ 切到夜晚';">☾ 切到夜晚</button>

  <!-- ============ 天空层 ============ -->
  <div class="sky">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="day-sun"></div>
    <div class="night-moon"></div>

    <!-- 星星 -->
    <span class="star" style="top:12%;left:20%;width:3px;height:3px;animation-delay:0s"></span>
    <span class="star" style="top:22%;left:45%;width:2px;height:2px;animation-delay:1.2s"></span>
    <span class="star" style="top:10%;left:70%;width:3px;height:3px;animation-delay:2s"></span>
    <span class="star" style="top:30%;left:82%;width:2px;height:2px;animation-delay:0.6s"></span>
    <span class="star" style="top:40%;left:12%;width:2px;height:2px;animation-delay:2.6s"></span>
    <span class="star" style="top:16%;left:92%;width:2px;height:2px;animation-delay:3.2s"></span>

    <div class="greeting">
      <div class="hello">早安 · 夏天</div>
      <div class="hint">今日水星在你的 10宫·事业搭了座桥，适合推进那件悬着的事</div>
    </div>

    <!-- 今日星象卡：月相 + 月亮落座 + Domain 建议 -->
    <div class="sky-card">
      <div class="moon-icon">
        <svg width="46" height="46" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="cres" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#FFF7DC"/>
              <stop offset="100%" stop-color="#FFE2A6"/>
            </linearGradient>
          </defs>
          <circle cx="50" cy="50" r="40" fill="#DCE6F0"/>
          <circle cx="62" cy="40" r="40" fill="url(#cres)"/>
        </svg>
      </div>
      <div>
        <div class="moon-title">今日 · 上弦月 · 月亮落射手座</div>
        <div class="moon-sub">适合推进那件悬着的事 —— 把想说的话，说出来</div>
      </div>
    </div>
  </div>

  <!-- ============ 花园层 ============ -->
  <div class="garden">
    <!-- 小花 -->
    <span class="flower f1">🌼</span><span class="flower f2">🌸</span>
    <span class="flower f3">🌷</span><span class="flower f4">🌱</span>
    <span class="flower f5">🌼</span><span class="flower f6">🌻</span>
    <span class="flower f7">🌺</span><span class="flower f8">🌿</span>
    <span class="flower f9">🌸</span><span class="flower f10">🌼</span>

    <!-- 蝴蝶（昼）/ 萤火虫（夜） -->
    <span class="butterfly b1">🦋</span>
    <span class="butterfly b2">🦋</span>
    <span class="firefly ff1"></span><span class="firefly ff2"></span>
    <span class="firefly ff3"></span><span class="firefly ff4"></span>
    <span class="firefly ff5"></span>

    <!-- 今日行运星灵来访：水星（微光，蓝色系） -->
    <div class="visit" onclick="alert('「今日水星想见你」→ 这里弹选择页/换星灵')">
      <div class="v-orb">☿</div>
      <div class="v-note">今日它想见你 · 换一位？</div>
    </div>

    <!-- 用户链接的星灵：月亮（方案A 用户主权，花园中央） -->
    <div class="spirit" onclick="alert('点星灵 → 和「想被抱抱的我」聊聊')">
      <div class="orb">
        <span class="glyph">☾</span>
        <span class="dust d1"></span>
        <span class="dust d2"></span>
        <span class="dust d3"></span>
      </div>
      <div class="s-name">月亮</div>
      <div class="s-heal">想被抱抱的我</div>
      <div class="s-line">你回来了，今天想靠一下吗？</div>
      <div class="tap-hint">点我 · 和我说说话</div>
    </div>
  </div>

  <!-- ============ 底部 tab ============ -->
  <div class="tabbar">
    <div class="tab active"><span class="ic">🏡</span>花园</div>
    <div class="tab"><span class="ic dot">✉️</span>信箱</div>
    <div class="tab"><span class="ic">🪐</span>我的宇宙</div>
  </div>

  <div class="note">P0 氛围原型 · 纯 CSS 无插画资产 · ☾ 按钮切昼夜 · 双击可在浏览器直接打开</div>
</body>
</html>
