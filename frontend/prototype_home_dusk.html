<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星灵花园 · 首页原型 v6（暮色星野 · 统一视觉）</title>
<style>
  /* ============================================================
     v6 · 暮色星野 —— 唯一答案：一个世界，一种温度，不切昼夜
     v5 的两副面孔（白昼卡 / 夜晚天）本身就是「不统一」，作废。
     这一版：一整片暮色天空就是全部。卡片是暮色玻璃，浮在同一天里。

       治愈感 = 暖色温：地平线那抹琥珀光是全天最安心的光
       占星感 = 深蓝 + 渐亮的星 + 每颗星灵的语义 accent 色
       陪伴感 = 会呼吸的月亮住在每日星语卡里，左边发光体右边今日的话
       可用性 = 星语卡 / 星灵轮播 / 回访卡，全是玻璃，可扫，不离开天空

     一个系统：语义行星色 + 真实占星符文 + 细线图标 + 零 emoji + 慢动效。
     ============================================================ */

  :root {
    --serif: "Noto Serif SC", "Songti SC", "STSong", "Kaiti SC", serif;
    --sans:  "HarmonyOS Sans", "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;

    /* 暮色天空 */
    --top: #191E38;            /* 深暖蓝 */
    --mid: #202648;            /* 暮蓝 */
    --bottom: #14172A;         /* 前景暖暗 */

    --ink: #F5EFE4;            /* 暖象牙文字 */
    --ink-soft: rgba(245, 239, 228, 0.6);
    --line: rgba(245, 239, 228, 0.12);

    --glass: rgba(255, 255, 255, 0.055);
    --glass-strong: rgba(255, 255, 255, 0.10);
    --glass-border: rgba(245, 239, 228, 0.14);

    --gold: #E8D9A8;           /* 月亮珍珠光 */
    --gold-soft: rgba(232, 217, 168, 0.28);
    --ember: #E79A6E;          /* 信号：温热余烬 */

    --glyph: rgba(74, 68, 96, 0.85);
    --dot-off: #3A3D5C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--top);
    -webkit-user-select: none; user-select: none;
    overflow: hidden;
  }

  /* ============================================================
     一整片暮色天空（固定底层）
     ============================================================ */
  .sky {
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(700px 260px at 50% 42%, rgba(201, 143, 107, 0.26), transparent 72%),
      radial-gradient(1000px 560px at 50% 38%, rgba(122, 78, 88, 0.20), transparent 78%),
      linear-gradient(180deg, var(--top) 0%, var(--mid) 50%, var(--bottom) 100%);
  }
  .star {
    position: absolute;
    background: var(--gold);
    border-radius: 50%;
    opacity: 0;
    animation: twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.55); }
    50%      { opacity: 0.45; transform: scale(1); }
  }

  /* ============================================================
     内容层（浮在天上的玻璃）
     ============================================================ */
  .content {
    position: relative; z-index: 2;
    height: 100vh;
    overflow-y: auto; overflow-x: hidden;
    padding-bottom: 88px;
    scrollbar-width: none;
  }
  .content::-webkit-scrollbar { display: none; }
  .pad { padding: 0 22px; }

  /* 顶栏：直接浮在天空上 */
  header { display: flex; align-items: center; justify-content: space-between; padding: 22px 22px 16px; }
  .eyebrow { font-size: 10px; letter-spacing: .24em; color: var(--ink-soft); font-weight: 500; }
  .hello { margin-top: 2px; font-size: 23px; font-weight: 600; color: var(--ink); letter-spacing: .5px; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 40% 34%, #F7F0DE, #D9BF8F 82%);
    color: #6A5238; font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
    cursor: pointer;
  }

  /* ============================================================
     星语卡 = 星灵住在里面：左边呼吸的月光体，右边今日的话
     ============================================================ */
  .dh-card {
    position: relative;
    border-radius: 28px;
    padding: 18px;
    display: flex; align-items: center; gap: 15px;
    background: linear-gradient(160deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.28), 0 0 70px rgba(232, 217, 168, 0.10);
  }
  .dh-orb {
    position: relative; flex: none;
    width: 76px; height: 76px; border-radius: 50%;
    background: radial-gradient(circle at 42% 34%,
      rgba(255, 250, 242, 0.98) 0%,
      rgba(244, 234, 214, 0.92) 36%,
      rgba(216, 192, 148, 0.5) 68%,
      rgba(216, 192, 148, 0) 100%);
    box-shadow: 0 0 30px var(--gold-soft), 0 0 72px var(--gold-soft);
    animation: breathe 4.6s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: var(--glyph);
    cursor: pointer;
  }
  .dh-orb::after {   /* 身后一圈柔光环 */
    content: ""; position: absolute; inset: -16px; border-radius: 50%;
    border: 1px solid rgba(232, 217, 168, 0.14);
    animation: ring-breathe 4.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-4px) scale(1.03); }
  }
  @keyframes ring-breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50%      { opacity: 1; transform: scale(1.06); }
  }
  .dh-eyebrow { font-size: 10.5px; letter-spacing: .14em; color: var(--ink-soft); }
  .dh-title { margin-top: 6px; font-family: var(--serif); font-size: 17px; line-height: 1.62; color: var(--ink); }
  .dh-btn {
    margin-top: 11px; border-radius: 999px; background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.16); color: #F5EFE4;
    font-size: 11px; letter-spacing: 2px; padding: 7px 15px; cursor: pointer;
  }
  .dh-btn:active { background: rgba(255, 255, 255, 0.22); }

  /* ============================================================
     星灵轮播
     ============================================================ */
  .sec-head { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 22px; }
  .sec-sub { font-size: 12px; color: var(--ink-soft); }
  .sec-title { margin-top: 3px; font-size: 19px; font-weight: 600; color: var(--ink); }
  .dots { display: flex; gap: 5px; padding-bottom: 4px; }
  .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--dot-off); transition: all .3s ease; }
  .dot.on { width: 15px; background: var(--ink); }

  .carousel { margin: 12px -22px 0; overflow: hidden; }
  .track { display: flex; gap: 12px; padding-left: 22px; transition: transform .5s ease; }
  .spirit {
    flex: 0 0 292px; border-radius: 26px; overflow: hidden;
    background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(12px);
  }
  .scene { position: relative; height: 150px; overflow: hidden; }
  .scene .halo { position: absolute; right: 14px; top: 10px; width: 76px; height: 76px; border-radius: 50%; }
  .scene .chip {
    position: absolute; left: 13px; top: 13px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.22); border: 1px solid rgba(255, 255, 255, 0.25);
    color: #fff; font-size: 10.5px; letter-spacing: 1px; padding: 4px 10px;
  }
  .scene .tile {
    position: absolute; left: 13px; bottom: 13px; width: 52px; height: 52px; border-radius: 18px;
    background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.28);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
  }
  .scene .tile img { width: 38px; height: 38px; object-fit: contain; }
  .scene .spark { position: absolute; right: 14px; bottom: 12px; font-size: 20px; color: #FBF0CA; }
  .scene .sd { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: rgba(255, 255, 255, 0.6); opacity: .5; }

  /* 三颗星灵的语义色场（暮色压低饱和度） */
  .sp-moon .scene     { background: linear-gradient(150deg, #3A4563, #242E4A); }
  .sp-moon .halo      { background: radial-gradient(circle, rgba(244, 231, 187, 0.85), rgba(244, 231, 187, 0) 70%); }
  .sp-moon .cta       { background: #8B7446; }
  .sp-sun .scene      { background: linear-gradient(150deg, #A8682C, #7A4418); }
  .sp-sun .halo       { background: radial-gradient(circle, rgba(255, 216, 138, 0.9), rgba(255, 216, 138, 0) 70%); }
  .sp-sun .cta        { background: #B5712A; }
  .sp-mercury .scene  { background: linear-gradient(150deg, #3E6A68, #254A48); }
  .sp-mercury .halo   { background: radial-gradient(circle, rgba(185, 231, 220, 0.75), rgba(185, 231, 220, 0) 70%); }
  .sp-mercury .cta    { background: #3E7B76; }

  .sp-body { padding: 14px 16px 15px; }
  .sp-namerow { display: flex; align-items: baseline; justify-content: space-between; }
  .sp-name { font-size: 18px; font-weight: 600; color: var(--ink); }
  .sp-heal { font-family: var(--serif); font-size: 11px; letter-spacing: 1px; color: var(--gold); }
  .sp-line { margin-top: 7px; font-size: 13px; line-height: 1.55; color: var(--ink); opacity: 0.82; }
  .sp-cta {
    margin-top: 12px; width: 100%; border: 0; border-radius: 13px; padding: 11px 0;
    font-size: 14px; font-weight: 500; color: #fff; text-align: center; cursor: pointer;
  }
  .sp-cta:active { filter: brightness(1.08); }

  .nav-btns { display: flex; justify-content: center; gap: 12px; margin-top: 12px; }
  .nav-btn {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid var(--glass-border); background: var(--glass);
    color: var(--ink-soft); cursor: pointer; backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
  }

  /* 回访卡 */
  .return { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
  .rcard {
    position: relative;
    border: 1px solid var(--glass-border); background: var(--glass);
    border-radius: 18px; padding: 13px 14px 12px; backdrop-filter: blur(10px);
  }
  .rcard .r-ic {
    width: 30px; height: 30px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    color: var(--gold); background: var(--gold-soft);
  }
  .rcard .r-title { margin-top: 9px; font-size: 13.5px; font-weight: 600; color: var(--ink); }
  .rcard .r-line { margin-top: 3px; font-size: 11px; line-height: 1.5; color: var(--ink-soft); }
  .rcard .r-go { margin-top: 8px; font-size: 11px; letter-spacing: 1px; color: var(--gold); cursor: pointer; }
  .rcard .r-ember { position: absolute; top: 12px; right: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 6px var(--ember); }

  /* 底栏 */
  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    height: 62px; display: flex; align-items: center; justify-content: space-around;
    background: rgba(20, 23, 42, 0.55); backdrop-filter: blur(18px);
    border-top: 1px solid var(--glass-border);
  }
  .tab { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-soft); font-size: 10.5px; letter-spacing: 1px; cursor: pointer; padding: 4px 18px; }
  .tab .tic { font-size: 17px; line-height: 1; }
  .tab svg { display: block; }
  .tab.on { color: var(--ink); }
  .tab .t-ember { position: absolute; top: 0; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ember); box-shadow: 0 0 7px var(--ember); }

  /* ============================================================
     无障碍 & 兜底
     ============================================================ */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
  @supports not (backdrop-filter: blur(10px)) {
    .dh-card, .spirit, .rcard, nav { background: rgba(24, 28, 50, 0.85); }
  }
</style>
</head>
<body>
  <!-- 一整片暮色天空 -->
  <div class="sky">
    <span class="star" style="top:8%;left:16%;width:2px;height:2px;animation-delay:0s"></span>
    <span class="star" style="top:13%;left:55%;width:1.5px;height:1.5px;animation-delay:1.4s"></span>
    <span class="star" style="top:6%;left:80%;width:2px;height:2px;animation-delay:2.6s"></span>
    <span class="star" style="top:20%;left:30%;width:1.5px;height:1.5px;animation-delay:0.8s"></span>
    <span class="star" style="top:26%;left:70%;width:1.5px;height:1.5px;animation-delay:3.4s"></span>
    <span class="star" style="top:16%;left:92%;width:1.5px;height:1.5px;animation-delay:1.9s"></span>
  </div>

  <!-- 内容层 -->
  <div class="content">
    <header>
      <div>
        <div class="eyebrow">星灵花园 · 你的星空</div>
        <h1 class="hello">晚上好，林夏</h1>
      </div>
      <div class="avatar">☽</div>
    </header>

    <div class="pad">
      <!-- 星语卡 = 星灵住在里面 -->
      <div class="dh-card">
        <div class="dh-orb">☾</div>
        <div>
          <div class="dh-eyebrow">今日 · 上弦月 · 月亮落射手座</div>
          <div class="dh-title">水星在事业宫搭了座桥，<br>适合推进那件悬着的事。</div>
          <button class="dh-btn" onclick="toast('已收下今日星语')">收下星语</button>
        </div>
      </div>

      <!-- 星灵轮播 -->
      <div class="sec-head">
        <div>
          <div class="sec-sub">选择一位星灵，开始靠近自己</div>
          <div class="sec-title">今天想和谁聊聊？</div>
        </div>
        <div class="dots">
          <span class="dot on" id="dot0"></span>
          <span class="dot" id="dot1"></span>
          <span class="dot" id="dot2"></span>
        </div>
      </div>
    </div>

    <div class="carousel">
      <div class="track" id="track">
        <article class="spirit sp-moon">
          <div class="scene">
            <span class="sd" style="left:64%;top:14%"></span><span class="sd" style="left:82%;top:46%"></span>
            <div class="halo"></div>
            <span class="chip">温柔 · 直觉 · 接纳</span>
            <span class="spark">✦</span>
            <div class="tile"><img src="src/static/imgs/moon_active.png" alt="月亮"></div>
          </div>
          <div class="sp-body">
            <div class="sp-namerow"><span class="sp-name">月亮</span><span class="sp-heal">想被抱抱的我</span></div>
            <p class="sp-line">理解你那些没说出口的情绪，也愿意陪你慢慢看见它。</p>
            <button class="sp-cta cta" onclick="toast('和月亮聊聊 → 聊天页')">和月亮聊聊</button>
          </div>
        </article>

        <article class="spirit sp-sun">
          <div class="scene">
            <span class="sd" style="left:58%;top:22%"></span><span class="sd" style="left:86%;top:60%"></span>
            <div class="halo"></div>
            <span class="chip">勇气 · 活力 · 真实</span>
            <span class="spark">✦</span>
            <div class="tile"><img src="src/static/imgs/sun_default.png" alt="太阳"></div>
          </div>
          <div class="sp-body">
            <div class="sp-namerow"><span class="sp-name">太阳</span><span class="sp-heal">发光的那一面</span></div>
            <p class="sp-line">提醒你：你的光并不需要谁来允许。</p>
            <button class="sp-cta cta" onclick="toast('认识太阳（原型）')">认识太阳</button>
          </div>
        </article>

        <article class="spirit sp-mercury">
          <div class="scene">
            <span class="sd" style="left:70%;top:30%"></span><span class="sd" style="left:88%;top:14%"></span>
            <div class="halo"></div>
            <span class="chip">思考 · 表达 · 联结</span>
            <span class="spark">✦</span>
            <div class="tile"><img src="src/static/imgs/mercury_default.png" alt="水星"></div>
          </div>
          <div class="sp-body">
            <div class="sp-namerow"><span class="sp-name">水星</span><span class="sp-heal">好奇的那一面</span></div>
            <p class="sp-line">想听见你真正的想法，哪怕它还没有成形。</p>
            <button class="sp-cta cta" onclick="toast('认识水星（原型）')">认识水星</button>
          </div>
        </article>
      </div>
    </div>

    <div class="pad">
      <div class="nav-btns">
        <button class="nav-btn" aria-label="上一位星灵" onclick="moveSpirit(-1)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 3 5 8l5 5"/></svg>
        </button>
        <button class="nav-btn" aria-label="下一位星灵" onclick="moveSpirit(1)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m6 3 5 5-5 5"/></svg>
        </button>
      </div>

      <div class="return">
        <div class="rcard">
          <span class="r-ember"></span>
          <div class="r-ic">
            <svg width="16" height="13" viewBox="0 0 16 13" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1" y="1.5" width="14" height="10" rx="1.5"/><path d="M1.5 2.5 8 7.5l6.5-5"/></svg>
          </div>
          <div class="r-title">今日来信</div>
          <div class="r-line">今天谢谢你，把那句话说出来。</div>
          <div class="r-go" onclick="toast('读信 → 信箱页')">读信 →</div>
        </div>
        <div class="rcard">
          <div class="r-ic">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M7.5 3.5v4l2.6 2.6"/><circle cx="7.5" cy="7.5" r="6"/></svg>
          </div>
          <div class="r-title">继续昨天</div>
          <div class="r-line">那件没敢说出口的事</div>
          <div class="r-go" onclick="toast('回到昨天的话题')">去看看 →</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 底栏 -->
  <nav>
    <div class="tab on"><span class="tic">✦</span>花园</div>
    <div class="tab">
      <span class="t-ember"></span>
      <svg width="18" height="15" viewBox="0 0 18 15" fill="none" stroke="currentColor" stroke-width="1.2"><rect x="1" y="2" width="16" height="11" rx="1.5"/><path d="M1.5 3.5 9 8.5l7.5-5"/></svg>
      信箱
    </div>
    <div class="tab">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="9" cy="9" r="7"/><circle cx="9" cy="9" r="1.8"/></svg>
      我的宇宙
    </div>
  </nav>

  <script>
    var si = 0, track = document.getElementById('track');
    function moveSpirit(step) {
      si = Math.max(0, Math.min(2, si + step));
      track.style.transform = 'translateX(-' + (si * 304) + 'px)';
      for (var i = 0; i < 3; i++) document.getElementById('dot' + i).className = i === si ? 'dot on' : 'dot';
    }
    var toastEl = document.createElement('div');
    toastEl.style.cssText = 'position:fixed;bottom:78px;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:999px;background:#333A52;color:#F5EFE4;font-size:12px;padding:9px 16px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:300;opacity:0;transition:opacity .3s ease;pointer-events:none;';
    document.body.appendChild(toastEl);
    var timer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.style.opacity = '1';
      clearTimeout(timer);
      timer = setTimeout(function () { toastEl.style.opacity = '0'; }, 1700);
    }
  </script>
</body>
</html>
